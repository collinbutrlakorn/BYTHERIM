<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podcast | BYTHERIM</title>
  <meta name="description" content="The BYTHERIM podcast: draft breakdowns, film analysis, and NBA discourse.">
  <!-- share + icons -->
  <link rel="canonical" href="https://bytherim.com/podcast.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BYTHERIM">
  <meta property="og:url" content="https://bytherim.com/podcast.html">
  <meta property="og:title" content="Podcast | BYTHERIM">
  <meta property="og:description" content="The BYTHERIM podcast: draft breakdowns, film analysis, and NBA discourse.">
  <meta property="og:image" content="https://bytherim.com/assets/share/podcast.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Podcast | BYTHERIM">
  <meta name="twitter:description" content="The BYTHERIM podcast: draft breakdowns, film analysis, and NBA discourse.">
  <meta name="twitter:image" content="https://bytherim.com/assets/share/podcast.jpg">
  <meta name="theme-color" content="#06070a">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <!-- /share + icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Asap+Condensed:wght@400;500;600;700&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/site.js"></script>
</head>
<body>
<script>BTR.mount('podcast')</script>

<main class="container">
  <header class="page-head">
    <div class="page-head-row">
      <div>
        <span class="eyebrow">The BYTHERIM Podcast</span>
        <h1>Podcast</h1>
        <p>Draft breakdowns, film analysis and NBA conversation. New episodes every week.</p>
      </div>
      <div class="listen-row" data-social="spotify,apple,youtube,substack" data-labels></div>
    </div>
  </header>

  <section id="featured" aria-label="Latest episode">
    <div class="skeleton" style="height:330px"></div>
  </section>

  <section class="section" aria-labelledby="moreHead">
    <div class="section-head"><h2 id="moreHead">More episodes</h2></div>
    <div class="ep-list" id="episodes"></div>
  </section>
</main>

<script>
(function () {
  'use strict';
  const { esc, fmtDate, fmtDuration, CONFIG } = BTR;
  const APPLE_SHOW = CONFIG.social.apple.url;
  const APPLE_LOOKUP = 'https://itunes.apple.com/lookup?id=6807326876&entity=podcastEpisode&limit=200';

  const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');

  // Apple's lookup gives each episode's own page, so "Apple Podcasts" can
  // open the exact episode rather than the show. Falls back to the show.
  async function appleEpisodeLinks() {
    try {
      const res = await fetch(APPLE_LOOKUP);
      const data = await res.json();
      const map = new Map();
      (data.results || []).forEach(r => { if (r.trackName && r.trackViewUrl) map.set(norm(r.trackName), r.trackViewUrl); });
      return map;
    } catch (e) { return new Map(); }
  }

  function links(ep, apple) {
    const appleUrl = apple.get(norm(ep.title)) || APPLE_SHOW;
    return `<div class="ep-links">
      <a class="btn btn-ghost btn-sm" href="${esc(ep.url)}" target="_blank" rel="noopener">Substack</a>
      <a class="btn btn-ghost btn-sm" href="${esc(appleUrl)}" target="_blank" rel="noopener">Apple Podcasts</a>
      <a class="btn btn-ghost btn-sm" href="${esc(CONFIG.social.spotify.url)}" target="_blank" rel="noopener">Spotify</a>
    </div>`;
  }

  function meta(ep) {
    return `<div class="ep-meta">${[fmtDate(ep.date, true), fmtDuration(ep.duration)].filter(Boolean).map(m => `<span>${esc(m)}</span>`).join('')}</div>`;
  }

  function audio(ep) {
    return ep.audio ? `<audio controls preload="none" src="${esc(ep.audio)}"></audio>` : '';
  }

  Promise.all([BTR.loadPosts(), appleEpisodeLinks()]).then(([{ posts, podcastArt }, apple]) => {
    const eps = posts.filter(p => p.type === 'podcast');
    const featured = document.getElementById('featured');
    const list = document.getElementById('episodes');

    if (!eps.length) {
      featured.innerHTML = `<div class="empty-state">Episodes couldn't be loaded right now. Listen on
        <a href="${CONFIG.social.spotify.url}" target="_blank" rel="noopener">Spotify</a> or
        <a href="${APPLE_SHOW}" target="_blank" rel="noopener">Apple Podcasts</a>.</div>`;
      document.getElementById('moreHead').closest('section').remove();
      return;
    }

    const [latest, ...rest] = eps;
    const art = ep => esc(ep.image || podcastArt || 'assets/logo-header.png');

    featured.innerHTML = `
      <article class="featured-ep">
        <img class="art" src="${art(latest)}" alt="">
        <div>
          <span class="tag">Latest episode</span>
          <h2><a href="${esc(latest.url)}" target="_blank" rel="noopener">${esc(latest.title)}</a></h2>
          ${meta(latest)}
          <p style="margin-top:.7rem">${esc(latest.summary)}</p>
          ${audio(latest)}
          ${links(latest, apple)}
        </div>
      </article>`;

    if (!rest.length) { document.getElementById('moreHead').closest('section').remove(); return; }
    list.innerHTML = rest.map(ep => `
      <article class="ep-row">
        <img class="art" src="${art(ep)}" alt="" loading="lazy">
        <div>
          ${meta(ep)}
          <h3><a href="${esc(ep.url)}" target="_blank" rel="noopener">${esc(ep.title)}</a></h3>
          <p>${esc(ep.summary)}</p>
          ${audio(ep)}
          ${links(ep, apple)}
        </div>
      </article>`).join('');
  });
})();
</script>
</body>
</html>
