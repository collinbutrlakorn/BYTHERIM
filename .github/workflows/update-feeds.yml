# Keeps data/feeds.json (a copy of the Substack and podcast feeds) fresh.
# The site reads the feeds live first; this copy is what shows if the free
# feed converter it relies on is down. Run by hand from the Actions tab:
# "Update feed snapshot" -> Run workflow.
name: Update feed snapshot

on:
  schedule:
    - cron: '41 */4 * * *'   # every 4 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot the feeds
        run: python3 tools/update-feeds.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/feeds.json; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/feeds.json
          git commit -m "Update feed snapshot"
          git pull --rebase -q
          git push
