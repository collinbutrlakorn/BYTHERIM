# Refreshes data/stats.json (college stats for the big board) every morning
# from Barttorvik, and commits it only when a number actually changed.
# Run it by hand from the repo's Actions tab: "Update big board stats" -> Run workflow.
name: Update big board stats

on:
  schedule:
    - cron: '17 11 * * *'   # daily, ~3am Alaska / 7am Eastern
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull stats from Barttorvik
        run: node tools/update-stats.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/stats.json; then
            echo "No stat changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          git commit -m "Update big board stats"
          git push
