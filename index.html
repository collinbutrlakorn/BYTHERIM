<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon.png">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BYTHERIM Recruiting</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <style>
    /* ==========================================================================
       1. DESIGN SYSTEM & VERDANA TYPOGRAPHY
       ========================================================================== */
    :root {
      --bg-dark: #000000;          /* Pure black */
      --bg-card: #111111;          /* Dark grey for cards/containers */
      --bg-hover: #1e1e1e;         /* Slightly lighter grey for hover */
      --accent-main: #ffffff;      /* Main accent (White) */
      --accent-hover: #cccccc;     
      --text-main: #ffffff;        /* Primary text */
      --text-muted: #888888;       /* Subtitles / Muted text */
      --border-color: #333333;     /* Section dividers */
      
      /* Rating Badge Colors */
      --star-color: #ffffff;       /* Uniform Star Color */
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: Verdana, sans-serif; 
    }

    body { 
      background-color: var(--bg-dark); 
      color: var(--text-main); 
      padding-bottom: 50px; 
    }

    /* Headings & Titles Defaults */
    h1, h2, h3, h4, th, .brand-title, .rank-num {
      font-weight: 700;
    }

    /* Header & Navigation */
    header { 
      background: var(--bg-card); 
      border-bottom: 1px solid var(--border-color); 
      padding: 1rem 2rem; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }

    .brand { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      cursor: pointer; 
      user-select: none;
    }

    .brand-logo-img { 
      height: 40px; 
      width: auto; 
      object-fit: contain; 
      border-radius: 6px;
    }

    .brand-title { 
      font-size: 1.3rem; 
      letter-spacing: 0.5px; 
      color: var(--text-main);
    }
    
    nav { display: flex; gap: 10px; flex-wrap: wrap; }
    .nav-btn { 
      background: transparent; 
      border: none; 
      color: var(--text-muted); 
      padding: 10px 18px; 
      font-weight: 400; 
      font-size: 0.85rem; 
      cursor: pointer; 
      border-radius: 8px; 
      transition: all 0.2s ease; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .nav-btn:hover { color: var(--text-main); background: var(--bg-hover); }
    .nav-btn.active { color: var(--bg-dark); background: var(--accent-main); font-weight: 700; }

    /* Layout Containers */
    .container { max-width: 1400px; margin: 2rem auto; padding: 0 1rem; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Controls & Filter Bar */
    .controls-bar { 
      display: flex; 
      gap: 10px; 
      margin-bottom: 1.5rem; 
      flex-wrap: wrap; 
      justify-content: space-between; 
      align-items: center;
    }

    .filter-group { display: flex; gap: 10px; flex-wrap: wrap; }

    .search-input, .select-input { 
      background: var(--bg-card); 
      border: 1px solid var(--border-color); 
      color: var(--text-main); 
      padding: 10px 14px; 
      border-radius: 8px; 
      font-size: 0.8rem; 
      outline: none; 
      font-weight: 400;
    }

    .search-input { width: 260px; }
    .search-input:focus, .select-input:focus { border-color: var(--accent-main); }

    /* Sub-Nav Controls for Statistics Page */
    .stats-controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      background: var(--bg-card);
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .sub-nav-group {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .sub-nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 16px;
      font-weight: 400;
      font-size: 0.75rem;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sub-nav-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
    .sub-nav-btn.active { color: var(--bg-dark); background: var(--accent-main); font-weight: 700; }

    /* Positional Multi-Select Filter */
    .pos-filter-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pos-filter-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .pos-pill-group {
      display: flex;
      gap: 4px;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }
    .pos-pill {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 12px;
      font-weight: 400;
      font-size: 0.75rem;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .pos-pill:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }
    .pos-pill.active {
      color: var(--bg-dark);
      background: var(--accent-main);
      font-weight: 700;
    }

    /* Query Search Builder Box */
    .query-builder-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 1.25rem;
    }
    .query-builder-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .query-badge {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .query-rule-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
      background: rgba(255, 255, 255, 0.02);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }
    .query-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
    }
    .query-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .query-btn-danger {
      color: #ff6b6b;
      border-color: rgba(255, 107, 107, 0.3);
    }
    .query-btn-danger:hover {
      background: rgba(255, 107, 107, 0.15);
    }
    .query-btn-toggle.engaged {
      background: #27ae60;
      color: #ffffff;
      border-color: #27ae60;
    }

    /* Data Tables */
    .table-container { 
      background: var(--bg-card); 
      border-radius: 12px; 
      border: 1px solid var(--border-color); 
      overflow-x: auto; 
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th { 
      background: rgba(255,255,255,0.02); 
      color: var(--text-muted); 
      padding: 12px 14px; 
      text-transform: uppercase; 
      font-size: 0.7rem; 
      letter-spacing: 0.5px; 
      border-bottom: 1px solid var(--border-color); 
      text-align: center;
      white-space: nowrap;
    }

    th.sortable {
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }
    th.sortable:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    td { padding: 12px 12px; border-bottom: 1px solid var(--border-color); vertical-align: middle; text-align: center; white-space: nowrap; font-weight: 400; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background-color: var(--bg-hover); cursor: pointer; }

    /* Centered Player Table Cell Layout */
    .player-cell {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      text-align: left;
    }

    .player-avatar-sm {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--bg-hover);
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    /* Badges & Highlights */
    .rank-num { font-size: 1rem; color: var(--text-muted); }
    .player-name { font-weight: 700; color: var(--text-main); text-decoration: none; display: block; font-size: 0.9rem; }
    .player-sub { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }
    
    .badge-pos, .badge-class, .badge-intl { 
      background: var(--bg-hover); 
      border: 1px solid var(--border-color);
      color: var(--text-main); 
      padding: 4px 8px; 
      border-radius: 6px; 
      font-size: 0.7rem; 
      display: inline-block; 
    }

    /* UNIFORM STAR RATING STYLES */
    .stars-5, .stars-4, .stars-3 { color: var(--star-color); font-weight: 700; }
    
    .rating-pill { 
      background: var(--bg-hover); 
      color: var(--text-main); 
      border: 1px solid var(--border-color); 
      padding: 4px 10px; 
      border-radius: 6px; 
      font-size: 0.8rem; 
      display: inline-block;
    }

    /* School Commit Logo & Cell Styling */
    .status-cell { 
      display: flex; 
      align-items: center; 
      justify-content: flex-start;
      gap: 8px; 
    }
    .school-logo { 
      width: 22px; 
      height: 22px; 
      object-fit: contain; 
      border-radius: 3px; 
      background: rgba(255,255,255,0.05);
    }

    .school-logo-lg {
      width: 36px;
      height: 36px;
      object-fit: contain;
      border-radius: 4px;
    }

    .commit-tag {
      background: var(--bg-hover);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 6px;
      margin: 3px;
      display: inline-block;
      font-size: 0.75rem;
    }

    /* ==========================================================================
       2. DETAILED PLAYER PROFILE STYLES
       ========================================================================== */
    .profile-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 2rem; }
    .profile-header { display: flex; justify-content: space-between; align-items: center; gap: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 1.5rem; margin-bottom: 1.5rem; }
    .profile-header-left { display: flex; align-items: center; gap: 24px; }
    
    .player-avatar-lg {
      width: 140px;
      height: 175px;
      border-radius: 12px;
      object-fit: cover;
      background: var(--bg-hover);
      border: 2px solid var(--border-color);
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .profile-title-area h1 { font-size: 1.8rem; margin-bottom: 0.4rem; text-align: left; }
    .profile-meta-line { display: flex; gap: 10px; align-items: center; color: var(--text-muted); font-size: 0.85rem; flex-wrap: wrap; }

    .profile-top-row {
      display: flex;
      gap: 1.25rem;
      margin-bottom: 1.5rem;
      align-items: stretch;
    }

    .profile-top-row > div {
      flex: 1;
      min-width: 280px;
      margin-bottom: 0 !important;
    }

    .spec-box { background: rgba(255,255,255,0.03); padding: 1.2rem; border-radius: 10px; border: 1px solid var(--border-color); text-align: left; display: flex; flex-direction: column; justify-content: flex-start; }
    .spec-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .spec-item:last-child { border-bottom: none; }
    .spec-label { color: var(--text-muted); font-size: 0.78rem; font-weight: 700; }
    .spec-value { font-size: 0.85rem; }

    .recruiting-box { background: rgba(255,255,255,0.03); padding: 1.2rem; border-radius: 10px; border: 1px solid var(--border-color); text-align: left; display: flex; flex-direction: column; justify-content: flex-start; }
    
    .commit-standout-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1rem 1.2rem;
      margin-bottom: 1rem;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .uncommitted-box {
      background: transparent;
      border: 1px dashed var(--border-color);
      border-radius: 10px;
      padding: 0.8rem 1.2rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    .commit-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; color: var(--text-muted); text-transform: uppercase; }
    .commit-main-info { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 6px; }
    .commit-standout-logo { width: 36px; height: 36px; object-fit: contain; }
    .commit-school-name { font-size: 1.1rem; font-weight: 700; color: var(--text-main); letter-spacing: 0.5px; }

    .recruiting-section-title { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; margin-top: 8px; }
    
    .inline-school-logo {
      height: 1.1em;
      width: 1.1em;
      object-fit: contain;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .final-list-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 0.8rem; }
    .final-school-card {
      background: var(--bg-hover);
      border: 1px solid var(--border-color);
      font-size: 0.85rem;
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .final-school-card.is-commit {
      background: var(--text-main);
      border-color: var(--text-main);
      color: var(--bg-dark);
      font-weight: 700;
    }

    .offers-flex { display: flex; flex-wrap: wrap; gap: 6px; }
    .offer-pill {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 5px 10px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .accolades-list { display: flex; flex-direction: column; gap: 8px; }
    .accolade-pill {
      background: var(--bg-hover);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .accolade-pill:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent-main);
      transform: translateY(-1px);
    }
    .accolade-logo {
      height: 24px;
      width: 24px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .scouting-report-full {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      text-align: left;
    }
    .scouting-report-full h3 { font-size: 1rem; margin-bottom: 0.75rem; color: var(--text-main); font-weight: 700; }
    .scouting-report-full p { color: var(--text-muted); line-height: 1.7; margin-bottom: 1.5rem; font-size: 0.88rem; }

    .scouting-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      font-size: 0.85rem;
    }

    .stats-box-full {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.5rem;
      text-align: left;
    }

    .profile-stats-table-wrapper {
      overflow-x: auto;
      margin-top: 0.8rem;
    }

    .profile-stats-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    .profile-stats-table th {
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-muted);
      padding: 10px 12px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-color);
      text-align: center;
    }

    .profile-stats-table td {
      padding: 12px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      text-align: center;
    }

    .profile-stats-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .level-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      text-transform: uppercase;
      background: var(--bg-hover);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    /* ==========================================================================
       3. SCHOOL DETAIL & ACCOLADE DETAIL PAGE STYLES
       ========================================================================== */
    .back-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-bottom: 1.25rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .back-btn:hover { background: var(--bg-hover); }

    .school-detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 1.75rem 2rem;
      margin-bottom: 1.5rem;
      gap: 20px;
      flex-wrap: wrap;
    }

    .school-detail-brand {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .school-detail-logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
    }

    .school-detail-stats {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .school-stat-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      padding: 12px 20px;
      border-radius: 10px;
      text-align: center;
    }

    .school-stat-val {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .school-stat-lbl {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .school-commits-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .commit-player-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.2rem;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .commit-player-card:hover {
      background: var(--bg-hover);
      transform: translateY(-2px);
    }

    @media (max-width: 900px) {
      .profile-top-row { flex-direction: column; }
      .scouting-columns { grid-template-columns: 1fr; }
      .profile-header { flex-direction: column; align-items: flex-start; }
      .controls-bar, .stats-controls-bar { flex-direction: column; align-items: stretch; }
      .search-input { width: 100%; }
      .filter-group { width: 100%; justify-content: space-between; }
      .sub-nav-group { justify-content: center; }
      .school-detail-header { flex-direction: column; align-items: flex-start; }
      .pos-filter-wrapper { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand" onclick="switchTab('rankings')" title="Return to Home">
      <img src="logo.png" alt="BYTHERIM" class="brand-logo-img" onerror="this.style.display='none';">
      <div class="brand-title">RECRUITING</div>
    </div>
    <nav>
      <button class="nav-btn active" onclick="switchTab('rankings')">Class Rankings</button>
      <button class="nav-btn" onclick="switchTab('schoolRankings')">School Rankings</button>
      <button class="nav-btn" onclick="switchTab('stats')">Statistics</button>
    </nav>
  </header>

  <div class="container">

    <!-- PLAYER RANKINGS TAB -->
    <div id="rankings-tab" class="tab-content active">
      <div class="controls-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Search player or school..." onkeyup="filterRecruits()">
        
        <div class="filter-group">
          <select id="classFilter" class="select-input" onchange="filterRecruits()">
            <option value="OVERALL">Overall Rankings (All Classes)</option>
            <option value="2028">Class of 2028</option>
            <option value="2029">Class of 2029</option>
            <option value="2030">Class of 2030</option>
            <option value="2031">Class of 2031</option>
            <option value="2032">Class of 2032</option>
            <option value="2033">Class of 2033</option>
            <option value="2034">Class of 2034</option>
            <option value="2035">Class of 2035</option>
            <option value="2036">Class of 2036</option>
            <option value="2037">Class of 2037</option>
            <option value="2038">Class of 2038</option>
            <option value="2039">Class of 2039</option>
            <option value="2040">Class of 2040</option>
          </select>

          <select id="stateFilter" class="select-input" onchange="filterRecruits()">
            <option value="ALL">All States / Regions</option>
            <option value="INT">International</option>
            <option value="AL">Alabama (AL)</option>
            <option value="AK">Alaska (AK)</option>
            <option value="AZ">Arizona (AZ)</option>
            <option value="AR">Arkansas (AR)</option>
            <option value="CA">California (CA)</option>
            <option value="CO">Colorado (CO)</option>
            <option value="CT">Connecticut (CT)</option>
            <option value="DE">Delaware (DE)</option>
            <option value="DC">District of Columbia (DC)</option>
            <option value="FL">Florida (FL)</option>
            <option value="GA">Georgia (GA)</option>

  <script>
    // PUBLISHED GOOGLE SHEETS COMMA-SEPARATED VALUES (.CSV) URL:
    const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTWvXoqFJkVFqt36wbBBfgFYUvPKhWCZIztoLIB9sjpc55AiFTdFpJZHMztVgJHyFyy0mtO_MYGD76N/pub?gid=0&single=true&output=csv';

    // ACCOLADE FILE MAPPER (Standardized to curly apostrophe)
    const ACCOLADE_MAP = {
      "McDonald's All-American": "mcdaag.png",
      "Nike Hoop Summit": "nikehoopsummit.png",
      "Jordan Brand Classic": "jbc.png"
    };

    // STAT LABELS FOR QUERY BUILDER & DASHBOARD VIEWS
    const STAT_LABELS = {
      basic: {
        ppg: "PPG (Points)",
        rpg: "RPG (Rebounds)",
        apg: "APG (Assists)",
        spg: "SPG (Steals)",
        bpg: "BPG (Blocks)",
        topg: "TPG (Turnovers)",
        gp: "GP (Games)",
        mpg: "MPG (Minutes)",
        fg: "FG%",
        fg2: "2FG%",
        fg3: "3FG%",
        ft: "FT%"
      },
      advanced: {
        bpm: "BPM",
        obpm: "OBPM",
        dbpm: "DBPM",
        ts: "TS%",
        rts: "rTS%",
        efg: "eFG%",
        oreb: "OREB%",
        dreb: "DREB%",
        trb: "TRB%",
        ast: "AST%",
        tov: "TOV%",
        stl: "STL%",
        blk: "BLK%",
        usg: "USG%",
        ftr: "FTr",
        p3ar: "3PAr",
        ortg: "ORtg",
        drtg: "DRtg",
        net: "Net"
      },
      shooting: {
        fga2: "2FGA",
        fg2: "2FG%",
        rimFga: "Rim FGA",
        rimPct: "Rim %",
        shortMidFga: "Short Mid FGA",
        shortMidPct: "Short Mid %",
        longMidFga: "Long Mid FGA",
        longMidPct: "Long Mid %",
        rimMidRatio: "Rim/Mid",
        fga3: "3FGA",
        fg3: "3FG%",
        p3ar: "3PAr",
        fta: "FTA",
        ft: "FT%",
        ftr: "FTr"
      }
    };

    // ACTIVE STATS PAGE STATE
    let currentStatLevel = 'hs';    
    let currentStatView = 'basic';  
    let activeSelectedSchool = null;

    // MULTI-SELECT POSITIONS FOR STATS PAGE
    let selectedStatsPositions = ['PG', 'SG', 'SF', 'PF', 'C'];

    // QUERY SEARCH & HEATMAP STATE
    let queryRules = [];
    let isQueryEngaged = false;

    // STATS SORTING STATE
    let statsSortKey = 'ppg';
    let statsSortDir = 'desc';

    // Holds active parsed data from Google Sheets
    let recruits = [];
    let activeRecruit = null;

    // INITIALIZATION - Fetches data dynamically from Google Sheets
    window.onload = () => {
      if (GOOGLE_SHEET_CSV_URL === 'YOUR_PUBLISHED_CSV_URL_HERE' || !GOOGLE_SHEET_CSV_URL) {
        alert("Please set your published Google Sheets CSV URL inside the <script> tags at 'GOOGLE_SHEET_CSV_URL'.");
        return;
      }
      
      Papa.parse(GOOGLE_SHEET_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          const parseArray = (str) => str ? str.split(',').map(s => s.trim()).filter(Boolean) : [];
          
          const buildStatTier = (row, tier) => ({
            team: row[`${tier}_team`] || "N/A",
            gp: parseInt(row[`${tier}_gp`]) || 0,
            mpg: parseFloat(row[`${tier}_mpg`]) || 0,
            ppg: parseFloat(row[`${tier}_ppg`]) || 0,
            rpg: parseFloat(row[`${tier}_rpg`]) || 0,
            apg: parseFloat(row[`${tier}_apg`]) || 0,
            spg: parseFloat(row[`${tier}_spg`]) || 0,
            bpg: parseFloat(row[`${tier}_bpg`]) || 0,
            topg: parseFloat(row[`${tier}_topg`]) || 0,
            fg: row[`${tier}_fg`] || "0.0%",
            fg2: row[`${tier}_fg2`] || "0.0%",
            fg3: row[`${tier}_fg3`] || "0.0%",
            ft: row[`${tier}_ft`] || "0.0%",
            bpm: row[`${tier}_bpm`] || "0.0", obpm: row[`${tier}_obpm`] || "0.0", dbpm: row[`${tier}_dbpm`] || "0.0",
            ts: row[`${tier}_ts`] || "0.0%", rts: row[`${tier}_rts`] || "0.0%", efg: row[`${tier}_efg`] || "0.0%",
            oreb: row[`${tier}_oreb`] || "0.0%", dreb: row[`${tier}_dreb`] || "0.0%", trb: row[`${tier}_trb`] || "0.0%",
            ast: row[`${tier}_ast`] || "0.0%", tov: row[`${tier}_tov`] || "0.0%", stl: row[`${tier}_stl`] || "0.0%",
            blk: row[`${tier}_blk`] || "0.0%", usg: row[`${tier}_usg`] || "0.0%", ftr: row[`${tier}_ftr`] || ".000",
            p3ar: row[`${tier}_p3ar`] || ".000", ortg: row[`${tier}_ortg`] || "0.0", drtg: row[`${tier}_drtg`] || "0.0", net: row[`${tier}_net`] || "0.0",
            fga2: parseFloat(row[`${tier}_fga2`]) || 0, rimFga: parseFloat(row[`${tier}_rimFga`]) || 0, rimPct: row[`${tier}_rimPct`] || "0.0%",
            shortMidFga: parseFloat(row[`${tier}_shortMidFga`]) || 0, shortMidPct: row[`${tier}_shortMidPct`] || "0.0%",
            longMidFga: parseFloat(row[`${tier}_longMidFga`]) || 0, longMidPct: row[`${tier}_longMidPct`] || "0.0%",
            rimMidRatio: row[`${tier}_rimMidRatio`] || "0.00", fga3: parseFloat(row[`${tier}_fga3`]) || 0, fta: parseFloat(row[`${tier}_fta`]) || 0
          });

          recruits = results.data.map(row => ({
            id: row.id || Math.random().toString(36).substr(2, 9),
            rank: (row.rank && !isNaN(parseInt(row.rank))) ? parseInt(row.rank) : "N/A",
            classYear: row.classYear || "2028",
            name: row.name || "Unknown Player",
            dob: row.dob || "N/A",
            pfp: row.pfp ? encodeURI(row.pfp.trim()) : "",
            pos: row.pos || "G",
            height: row.height || "6'0\"",
            weight: row.weight || "160 lbs",
            wingspan: row.wingspan || "N/A",
            hs: row.hs || "N/A",
            state: row.state || "ALL",
            hometown: row.hometown || "N/A",
            stars: parseInt(row.stars) || 3,
            rating: parseInt(row.rating) || 80,
            status: row.status || "Uncommitted",
            committedSchool: row.committedSchool || null,
            commitLogo: row.commitLogo ? encodeURI(row.commitLogo.trim()) : "",
            accolades: parseArray(row.accolades),
            finalList: row.finalListSchools ? {
              title: row.finalListTitle || "Final List",
              schools: parseArray(row.finalListSchools)
            } : null,
            offers: parseArray(row.offers),
            scouting: row.scouting || "No description available.",
            strengths: parseArray(row.strengths),
            weaknesses: parseArray(row.weaknesses),
            stats: {
              hs: buildStatTier(row, 'hs'),
              aau: buildStatTier(row, 'aau'),
              fiba: buildStatTier(row, 'fiba'),
              intl: buildStatTier(row, 'intl')
            }
          }));

          if (recruits.length > 0) {
            activeRecruit = recruits[0];
            renderProfile(activeRecruit);
          }
          filterRecruits();
          renderSchoolRankings();
          renderQueryRulesUI();
          renderStatsDashboard();
        }
      });
    };

    function getSchoolLogoPath(schoolName) {
      if (!schoolName) return '';
      const clean = schoolName.toLowerCase().replace(/[^a-z0-9]/g, '');
      return `schoollogos/${clean}.png`;
    }

    function parseStatValue(val) {
      if (val === undefined || val === null || val === "N/A") return null;
      if (typeof val === 'number') return val;
      if (typeof val === 'string') {
        let cleaned = val.replace(/[%+]/g, '').trim();
        let parsed = parseFloat(cleaned);
        return isNaN(parsed) ? null : parsed;
      }
      return null;
    }
    
    function getComputedStat(st, key) {
      if (!st) return "N/A";
      if (st[key] !== undefined) return st[key];
      if (key === 'rimMidRatio') {
        let mid = (st.shortMidFga || 0) + (st.longMidFga || 0);
        return mid > 0 ? (st.rimFga / mid).toFixed(2) : "0.00";
      }
      return "N/A";
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      if (tabName === 'rankings') {
        document.getElementById('rankings-tab').classList.add('active');
        if (document.querySelectorAll('.nav-btn')[0]) document.querySelectorAll('.nav-btn')[0].classList.add('active');
      } else if (tabName === 'schoolRankings') {
        document.getElementById('schoolRankings-tab').classList.add('active');
        if (document.querySelectorAll('.nav-btn')[1]) document.querySelectorAll('.nav-btn')[1].classList.add('active');
      } else if (tabName === 'stats') {
        document.getElementById('stats-tab').classList.add('active');
        if (document.querySelectorAll('.nav-btn')[2]) document.querySelectorAll('.nav-btn')[2].classList.add('active');
      } else if (tabName === 'profile') {
        document.getElementById('profile-tab').classList.add('active');
      } else if (tabName === 'schoolDetail') {
        document.getElementById('schoolDetail-tab').classList.add('active');
      } else if (tabName === 'accoladeDetail') {
        document.getElementById('accoladeDetail-tab').classList.add('active');
      }
    }

    function setStatLevel(level, element) {
      currentStatLevel = level;
      const buttons = document.querySelectorAll('#levelTabs .sub-nav-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      if (element) element.classList.add('active');
      renderStatsDashboard();
    }

    function setStatView(view, element) {
      currentStatView = view;
      const buttons = document.querySelectorAll('#viewTabs .sub-nav-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      if (element) element.classList.add('active');

      if (view === 'basic') statsSortKey = 'ppg';
      else if (view === 'advanced') statsSortKey = 'bpm';
      else if (view === 'shooting') statsSortKey = 'fg2';
      
      statsSortDir = 'desc';

      renderQueryRulesUI();
      renderStatsDashboard();
    }

    function togglePosFilter(pos, btn) {
      if (selectedStatsPositions.includes(pos)) {
        selectedStatsPositions = selectedStatsPositions.filter(p => p !== pos);
        btn.classList.remove('active');
      } else {
        selectedStatsPositions.push(pos);
        btn.classList.add('active');
      }
      renderStatsDashboard();
    }

    function toggleQueryEngage() {
      isQueryEngaged = !isQueryEngaged;
      renderQueryRulesUI();
      renderStatsDashboard();
    }

    function addQueryRule() {
      const availableStats = Object.keys(STAT_LABELS[currentStatView]);
      const defaultStat = availableStats[0] || 'ppg';
      queryRules.push({
        id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
        statKey: defaultStat,
        op: '>=',
        value: ''
      });
      isQueryEngaged = true;
      renderQueryRulesUI();
      renderStatsDashboard();
    }

    function removeQueryRule(id) {
      queryRules = queryRules.filter(r => r.id !== id);
      if (queryRules.length === 0) isQueryEngaged = false;
      renderQueryRulesUI();
      renderStatsDashboard();
    }

    function clearQueryRules() {
      queryRules = [];
      isQueryEngaged = false;
      renderQueryRulesUI();
      renderStatsDashboard();
    }

    function updateQueryRule(id, field, val) {
      const rule = queryRules.find(r => r.id === id);
      if (rule) {
        rule[field] = val;
        renderStatsDashboard();
      }
    }

    function renderQueryRulesUI() {
      const container = document.getElementById('queryRulesContainer');
      const badge = document.getElementById('queryEngagedBadge');
      const toggleBtn = document.getElementById('toggleQueryBtn');

      if (isQueryEngaged) {
        badge.innerText = 'ENGAGED';
        badge.style.background = 'rgba(39, 174, 96, 0.2)';
        badge.style.color = '#2ecc71';
        badge.style.border = '1px solid #2ecc71';
        toggleBtn.innerText = 'Disengage Query Search';
        toggleBtn.classList.add('engaged');
      } else {
        badge.innerText = 'OFF';
        badge.style.background = 'rgba(255, 255, 255, 0.05)';
        badge.style.color = 'var(--text-muted)';
        badge.style.border = '1px solid var(--border-color)';
        toggleBtn.innerText = 'Engage Query Search';
        toggleBtn.classList.remove('engaged');
      }

      if (queryRules.length === 0) {
        container.innerHTML = `<div style="font-size: 0.75rem; color: var(--text-muted); font-style: italic; padding: 4px 0;">No active stat query rules. Click "+ Add Stat Rule" to query player statistics.</div>`;
        return;
      }

      const availableStats = STAT_LABELS[currentStatView];

      container.innerHTML = queryRules.map((rule) => {
        if (!availableStats[rule.statKey]) rule.statKey = Object.keys(availableStats)[0];

        const statOptionsHTML = Object.entries(availableStats).map(([k, label]) => {
          return `<option value="${k}" ${rule.statKey === k ? 'selected' : ''}>${label}</option>`;
        }).join('');

        return `
          <div class="query-rule-row">
            <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: bold;">Stat:</span>
            <select class="select-input" style="padding: 6px 10px; font-size: 0.75rem;" onchange="updateQueryRule('${rule.id}', 'statKey', this.value)">
              ${statOptionsHTML}
            </select>
            <select class="select-input" style="padding: 6px 10px; font-size: 0.75rem; width: 70px;" onchange="updateQueryRule('${rule.id}', 'op', this.value)">
              <option value=">=" ${rule.op === '>=' ? 'selected' : ''}>&ge;</option>
              <option value="<=" ${rule.op === '<=' ? 'selected' : ''}>&le;</option>
            </select>
            <input type="number" step="any" class="search-input" style="width: 110px; padding: 6px 10px; font-size: 0.75rem;" placeholder="Value..." value="${rule.value}" oninput="updateQueryRule('${rule.id}', 'value', this.value)">
            <button class="query-btn query-btn-danger" style="padding: 4px 10px; margin-left: auto;" onclick="removeQueryRule('${rule.id}')">Remove</button>
          </div>
        `;
      }).join('');
    }

    function evaluateQueryRule(playerData, rule) {
      if (rule.value === '') return true;
      const targetVal = parseFloat(rule.value);
      if (isNaN(targetVal)) return true;

      const pStatRaw = getComputedStat(playerData, rule.statKey);
      const pStat = parseStatValue(pStatRaw);
      
      if (pStat === null) return false;

      if (rule.op === '>=') return pStat >= targetVal;
      if (rule.op === '<=') return pStat <= targetVal;
      return true;
    }

    // MAIN RANKINGS TAB RENDER
    function filterRecruits() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const classYr = document.getElementById('classFilter').value;
      const state = document.getElementById('stateFilter').value;
      const pos = document.getElementById('posFilter').value;
      const stars = document.getElementById('starFilter').value;

      let filtered = recruits.filter(p => {
        const matchesSearch = p.name.toLowerCase().includes(search) || p.hs.toLowerCase().includes(search);
        const matchesClass = classYr === 'OVERALL' || p.classYear === classYr;
        const matchesState = state === 'ALL' || p.state === state;
        const matchesPos = pos === 'ALL' || p.pos.includes(pos);
        const matchesStars = stars === 'ALL' || p.stars == stars;
        return matchesSearch && matchesClass && matchesState && matchesPos && matchesStars;
      });

      if (classYr === 'OVERALL') filtered.sort((a, b) => b.rating - a.rating);
      else filtered.sort((a, b) => {
        let rankA = typeof a.rank === 'number' ? a.rank : 9999;
        let rankB = typeof b.rank === 'number' ? b.rank : 9999;
        return rankA - rankB;
      });

      renderRankingsTable(filtered, classYr === 'OVERALL');

    // STATS DASHBOARD RENDER
    function setStatsSort(key) {
      if (statsSortKey === key) {
        statsSortDir = statsSortDir === 'desc' ? 'asc' : 'desc';
      } else {
        statsSortKey = key;
        statsSortDir = 'desc';
      }
      renderStatsDashboard();
    }

    function computeHeatmapColors(sortedData, key) {
      let values = sortedData.map(p => parseStatValue(getComputedStat(p.stats[currentStatLevel], key))).filter(v => v !== null);
      if (values.length === 0) return {};

      let max = Math.max(...values);
      let min = Math.min(...values);
      let range = max - min;
      
      const heatMap = {};
      sortedData.forEach(p => {
        let rawVal = parseStatValue(getComputedStat(p.stats[currentStatLevel], key));
        if (rawVal === null) { heatMap[p.id] = 'transparent'; return; }
        
        let normalized = range === 0 ? 0.5 : (rawVal - min) / range;
        const isAscendingStat = (key === 'topg' || key === 'tov');
        if (isAscendingStat) normalized = 1 - normalized;
        
        // Heatmap colors: red (bad) to green (good)
        let r, g, b = 0;
        if (normalized < 0.5) {
          r = 255;
          g = Math.round(255 * (normalized / 0.5));
        } else {
          g = 255;
          r = Math.round(255 * (1 - (normalized - 0.5) / 0.5));
        }
        heatMap[p.id] = `rgba(${r}, ${g}, ${b}, 0.25)`;
      });
      return heatMap;
    }

    function renderStatsDashboard() {
      const classYr = document.getElementById('statsClassFilter').value;
      const thead = document.getElementById('statsTableHeader');
      const tbody = document.getElementById('statsTableBody');

      let filtered = recruits.filter(p => {
        let pStats = p.stats[currentStatLevel];
        if (!pStats || (!pStats.gp && !pStats.ppg)) return false; 
        
        const matchesClass = classYr === 'ALL' || p.classYear === classYr;
        if (!matchesClass) return false;

        const matchesPos = selectedStatsPositions.includes('ALL') || selectedStatsPositions.some(pos => p.pos.includes(pos));
        if (!matchesPos) return false;

        if (isQueryEngaged && queryRules.length > 0) {
          let passesAll = true;
          for (let rule of queryRules) {
             if (!evaluateQueryRule(pStats, rule)) {
               passesAll = false; break;
             }
          }
          if (!passesAll) return false;
        }

        return true;
      });

      filtered.sort((a, b) => {
        let valA = parseStatValue(getComputedStat(a.stats[currentStatLevel], statsSortKey)) || 0;
        let valB = parseStatValue(getComputedStat(b.stats[currentStatLevel], statsSortKey)) || 0;
        return statsSortDir === 'desc' ? valB - valA : valA - valB;
      });

      const cols = STAT_LABELS[currentStatView];
      
      let headerHTML = `<tr>
        <th style="text-align: left; position: sticky; left: 0; background: var(--bg-card); z-index: 10;">Player</th>
        <th class="sortable" onclick="setStatsSort('gp')">GP ${statsSortKey==='gp'?(statsSortDir==='desc'?'▼':'▲'):''}</th>
      `;
      for (const [key, label] of Object.entries(cols)) {
        if(key === 'gp') continue; 
        let isSorted = statsSortKey === key;
        let arrow = isSorted ? (statsSortDir === 'desc' ? '▼' : '▲') : '';
        headerHTML += `<th class="sortable" onclick="setStatsSort('${key}')">${label} ${arrow}</th>`;
      }
      headerHTML += `</tr>`;
      thead.innerHTML = headerHTML;

      tbody.innerHTML = '';
      if(filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${Object.keys(cols).length + 1}" style="text-align:center; padding: 20px;">No players found matching current stat filters.</td></tr>`;
        return;
      }

      const heatMaps = {};
      if (isQueryEngaged) {
         for (const key of Object.keys(cols)) {
           heatMaps[key] = computeHeatmapColors(filtered, key);
         }
      }

      filtered.forEach(p => {
        const pStats = p.stats[currentStatLevel];
        const tr = document.createElement('tr');
        tr.onclick = () => { activeRecruit = p; renderProfile(p); switchTab('profile'); };

        const fallbackImg = `https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&background=1e1e1e&color=fff&size=100`;
        const avatarSrc = p.pfp ? p.pfp : fallbackImg;
        const imgTag = `<img src="${avatarSrc}" alt="${p.name}" class="player-avatar-sm" onerror="this.src='${fallbackImg}'">`;
        
        let rowHTML = `
          <td style="text-align: left; position: sticky; left: 0; background: var(--bg-card); z-index: 5;">
            <div class="player-cell">
              ${imgTag}
              <div>
                <a href="#" class="player-name">${p.name}</a>
                <div class="player-sub">${p.classYear} | ${p.pos}</div>
              </div>
            </div>
          </td>
          <td><span style="color: var(--text-muted); font-size: 0.8rem;">${pStats.gp || 0}</span></td>
        `;

        for (const [key, label] of Object.entries(cols)) {
          if (key === 'gp') continue;
          let val = getComputedStat(pStats, key);
          let bgCol = isQueryEngaged && heatMaps[key] ? heatMaps[key][p.id] || 'transparent' : 'transparent';
          
          rowHTML += `<td style="background-color: ${bgCol}; border-radius: 4px;"><span style="font-weight: 700;">${val}</span></td>`;
        }

        tr.innerHTML = rowHTML;
        tbody.appendChild(tr);
      });
    }

      let playersHtml = '';
      if (accoladePlayers.length === 0) {
        playersHtml = `<p style="color:var(--text-muted); padding: 20px 0;">No selections found for ${targetClassYear !== 'ALL' ? targetClassYear : 'All-Time'}.</p>`;
      } else {
        playersHtml = accoladePlayers.sort((a,b) => b.rating - a.rating).map(c => {
          const fallbackImg = `https://ui-avatars.com/api/?name=${encodeURIComponent(c.name)}&background=1e1e1e&color=fff&size=100`;
          const avatarSrc = c.pfp ? c.pfp : fallbackImg;
          
          let schStatus = `<span style="font-size:0.7rem; color:var(--text-muted);">Uncommitted</span>`;
          if(c.status.toLowerCase() === 'committed' && c.committedSchool) {
            schStatus = `
              <div style="display:flex; align-items:center; gap:6px; margin-top:4px;">
                 <img src="${getSchoolLogoPath(c.committedSchool)}" style="width:16px; height:16px;" onerror="this.style.display='none'">
                 <span style="font-size:0.7rem; color:var(--text-muted);">${c.committedSchool}</span>
              </div>
            `;
          }

          return `
            <div class="commit-player-card" onclick="activeRecruit = recruits.find(r=>r.id==='${c.id}'); renderProfile(activeRecruit); switchTab('profile');">
              <img src="${avatarSrc}" style="width:50px; height:50px; border-radius:50%; object-fit:cover; border:1px solid var(--border-color);" onerror="this.src='${fallbackImg}'">
              <div style="flex: 1;">
                <div style="font-weight:700; font-size:0.95rem; color:var(--text-main);">${c.name}</div>
                <div style="font-size:0.75rem; color:var(--text-muted); margin-top:2px;">
                   ${c.pos} | ${c.height} | <span class="stars-${c.stars}">${'★'.repeat(c.stars)}</span>
                </div>
                ${schStatus}
              </div>
            </div>
          `;
        }).join('');
      }

      container.innerHTML = `
        <div class="school-detail-header" style="justify-content: flex-start; gap: 30px;">
           <img src="accoladelogos/${logoSrc}" style="width:100px; height:100px; object-fit:contain;" onerror="this.src='accoladelogos/default_accolade.png'">
           <div>
             <h2 style="font-size: 1.8rem; margin-bottom: 6px;">${accoladeName} Selection</h2>
             <div class="badge-class" style="display:inline-block;">Class of ${targetClassYear !== 'ALL' ? targetClassYear : 'All-Time'}</div>
           </div>
        </div>
        <h3 style="font-size:1.1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px;">Selected Players (${accoladePlayers.length})</h3>
        <div class="school-commits-grid">
          ${playersHtml}
        </div>
      `;
      switchTab('accoladeDetail');
    }

    // UTILITY: Expose functions globally for inline onclick handlers
    window.switchTab = switchTab;
    window.filterRecruits = filterRecruits;
    window.renderSchoolRankings = renderSchoolRankings;
    window.setStatLevel = setStatLevel;
    window.setStatView = setStatView;
    window.togglePosFilter = togglePosFilter;
    window.toggleQueryEngage = toggleQueryEngage;
    window.addQueryRule = addQueryRule;
    window.removeQueryRule = removeQueryRule;
    window.clearQueryRules = clearQueryRules;
    window.updateQueryRule = updateQueryRule;
    window.renderStatsDashboard = renderStatsDashboard;
    window.setStatsSort = setStatsSort;
    window.renderSchoolDetail = renderSchoolDetail;
    window.renderAccoladeDetail = renderAccoladeDetail;

  </script>
</body>
</html>
