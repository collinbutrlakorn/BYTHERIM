<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2027 NBA Draft Big Board | BYTHERIM</title>
  <meta name="description" content="BYTHERIM's 2027 NBA Draft big board — prospect rankings by tier, archetypes, ages, measurements and scouting reports.">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://collinbutrlakorn.github.io/BYTHERIM/draft.html">
  <meta property="og:title" content="2027 NBA Draft Big Board | BYTHERIM">
  <meta property="og:description" content="Prospect rankings by tier, archetypes, ages, measurements and scouting reports.">
  <meta property="og:image" content="https://collinbutrlakorn.github.io/BYTHERIM/logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="2027 NBA Draft Big Board | BYTHERIM">
  <meta name="twitter:description" content="Prospect rankings by tier, archetypes, ages, measurements and scouting reports.">
  <meta name="twitter:image" content="https://collinbutrlakorn.github.io/BYTHERIM/logo.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Asap+Condensed:wght@400;500;600;700&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/site.js"></script>
  <script src="assets/board.js"></script>
</head>
<body>
<script>BTR.mount('draft')</script>

<main class="container">
  <header class="page-head">
    <div class="page-head-row">
      <div>
        <span class="eyebrow" id="boardEyebrow">2027 NBA Draft</span>
        <h1>Big Board</h1>
        <p id="boardIntro">BYTHERIM's rankings of the 2027 class, grouped by tier. Select a prospect to see his profile.</p>
        <nav class="board-years" id="yearChips" aria-label="Choose a draft year" hidden></nav>
      </div>
      <div class="board-summary" id="boardSummary" aria-live="polite"></div>
    </div>
  </header>

  <div class="board-toolbar" role="search">
    <label class="sr-only" for="boardSearch">Search prospects</label>
    <input id="boardSearch" class="board-search" type="search" placeholder="Search player or school" autocomplete="off">
    <div class="chip-group" id="posChips" aria-label="Filter by position"></div>
    <div class="chip-group" id="classChips" aria-label="Filter by class"></div>
    <span class="board-count" id="boardCount"></span>
    <button class="btn btn-ghost btn-sm tier-info-btn" id="tierInfoBtn" type="button" aria-expanded="false" aria-controls="tierInfo">
      <span data-icon="info" data-size="15"></span> Tiers
    </button>
  </div>
  <div class="tier-info card" id="tierInfo" hidden></div>

  <div class="board-cols" aria-hidden="true">
    <span class="c">#</span><span></span><span>Prospect</span>
    <span class="c">Pos</span><span class="c">Class</span><span class="c col-size" id="colSize">HT / WT</span>
    <span class="c" title="Age on draft night">Age</span><span>School</span>
  </div>

  <section id="board" aria-label="Ranked prospects">
    <div class="skeleton" style="height:64px;margin-bottom:.4rem"></div>
    <div class="skeleton" style="height:64px;margin-bottom:.4rem"></div>
    <div class="skeleton" style="height:64px"></div>
  </section>

  <section id="radarWrap" aria-label="On the radar" hidden>
    <div class="section-head" style="margin-top:2.5rem">
      <div>
        <h2>On the Radar</h2>
        <p id="radarIntro">Prospects outside the top 60 that BYTHERIM is still tracking, grouped by tier.</p>
      </div>
    </div>
    <div id="radar" hidden></div>
    <button class="btn btn-ghost radar-toggle" id="radarToggle" type="button" aria-expanded="false" aria-controls="radar"></button>
  </section>
</main>

<script>
(function () {
  'use strict';
  const { esc, icon, schoolLogo, initialsBadge } = BTR;

  // Tier colours carried over from the original board.
  const TIER_COLORS = { 1: '#f87171', 2: '#fb923c', 3: '#fbbf24', 4: '#facc15', 5: '#a3e635', 6: '#4ade80', 7: '#2dd4bf', 8: '#38bdf8', 9: '#818cf8', 10: '#60a5fa', '?': '#c084fc' };
  const POSITIONS = ['PG', 'SG', 'SF', 'PF', 'C'];
  const CLASSES = ['FR', 'SO', 'JR', 'SR', 'INTL'];
  const CLASS_LABEL = { FR: 'Freshman', SO: 'Sophomore', JR: 'Junior', SR: 'Senior', INTL: 'International' };

  const state = {
    all: [], q: '', pos: 'ALL', cls: 'ALL', radarOpen: false, openId: null, season: {}, hasPrev: false,
    year: BOARD.draftYear, boards: [{ year: BOARD.draftYear, current: true }]
  };
  const isPast = () => state.year !== BOARD.draftYear;

  const tierColor = t => TIER_COLORS[t] || 'var(--faint)';
  const tierLabel = t => (t == null ? 'Unassigned' : `Tier ${t}`);
  const ordinal = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th');

  // Where a prospect on a past board was drafted, short and long forms.
  function draftShort(p) {
    const d = p.draft;
    if (!d) return '';
    if (d.pick != null) return `#${d.pick}${d.team ? ' ' + d.team.abbr : ''}${d.year !== state.year ? ` ’${String(d.year).slice(2)}` : ''}`;
    return d.status;
  }
  function draftLong(p) {
    const d = p.draft;
    if (!d) return '';
    const team = d.team ? d.team.name : '';
    if (d.pick != null) return [`${ordinal(d.pick)} pick (round ${d.round})`, team, d.year].filter(Boolean).join(' · ');
    const undrafted = d.status === 'Undrafted';
    return [d.status, team && (undrafted ? `signed with ${team}` : team), undrafted ? d.year : ''].filter(Boolean).join(' · ');
  }
  // Profile: "Pick 3" and the team's logo (name on hover); a later
  // draft year gets a note, and Undrafted / Returned stay as words.
  function draftFact(p) {
    const d = p.draft;
    if (!d) return '';
    if (d.pick == null) return esc(d.status);
    const logo = d.team && d.team.logo
      ? `<img class="fact-logo" src="nbalogos/${encodeURIComponent(d.team.logo)}.png" alt="${esc(d.team.name)}" title="${esc(d.team.name)}">`
      : (d.team ? esc(d.team.name) : '');
    return `<span class="fact-pick">Pick ${d.pick}${logo ? ` <span aria-hidden="true">–</span> ${logo}` : ''}${d.year !== state.year ? ` <small>${d.year}</small>` : ''}</span>`;
  }

  // Phone rows: "Drafted #12 SAS", "Undrafted" or "Returned".
  function draftMeta(p) {
    if (!p.draft) return '';
    if (p.draft.pick != null) return `Drafted ${draftShort(p)}`;
    return p.draft.status === 'Returned to school' ? 'Returned' : p.draft.status;
  }
  function draftCell(p) {
    const d = p.draft;
    if (!d) return '<span class="pr-cell pr-drafted muted">—</span>';
    const logo = d.team && d.team.logo ? `<img src="nbalogos/${encodeURIComponent(d.team.logo)}.png" alt="" loading="lazy" onerror="this.remove()">` : '';
    if (d.pick == null) return `<span class="pr-cell pr-drafted muted" title="${esc(draftLong(p))}">${logo}${esc(d.status === 'Returned to school' ? 'Returned' : d.status)}</span>`;
    return `<span class="pr-cell pr-drafted" title="${esc(draftLong(p))}">${logo}<b>#${d.pick}</b>${d.year !== state.year ? `<small>${d.year}</small>` : ''}</span>`;
  }

  function logoFor(p) {
    return schoolLogo(p.isPro ? 'pro' : p.school); // schoollogos/pro.png for pros
  }
  function photoFor(p) {
    return p.image || initialsBadge(p.name);
  }

  // Movement since the last edition, when the sheet has a Prev Rank column.
  function moveHTML(p) {
    if (!state.hasPrev || p.rank == null) return '';
    if (p.prevRank == null) return '<span class="bd-move new" title="New to the board">New</span>';
    const d = p.prevRank - p.rank;
    if (!d) return '';
    return `<span class="bd-move ${d > 0 ? 'up' : 'down'}" title="${d > 0 ? 'Up' : 'Down'} ${Math.abs(d)} from #${p.prevRank}">${d > 0 ? '▲' : '▼'}${Math.abs(d)}</span>`;
  }

  // ------------------------------------------------------------ rows
  function rowHTML(p) {
    const hue = BOARD.ageHue(p.age);
    const age = p.age != null ? p.age.toFixed(1) : '—';
    const size = [p.height, p.weight].filter(Boolean).join(' / ') || '—';
    const schoolSub = p.isPro ? 'Professional' : (p.conference || '');
    const open = state.openId === p.id;
    return `
<article class="pr${open ? ' open' : ''}" id="p-${p.id}" style="--tier:${tierColor(p.tier)}">
  <button class="pr-main" type="button" aria-expanded="${open}" aria-controls="d-${p.id}" data-id="${p.id}">
    <span class="pr-rank${p.rank == null ? ' unranked' : ''}">${p.rank != null ? p.rank : 'NR'}${moveHTML(p)}</span>
    <img class="pr-photo" src="${esc(photoFor(p))}" alt="" loading="lazy" onerror="this.onerror=null;this.src='${initialsBadge(p.name)}'">
    <span class="pr-id">
      <span class="pr-name">${esc(p.name)}</span>
      <span class="pr-arch">${esc(p.archetype || 'Prospect')}</span>
      <span class="pr-mobile-meta"><img src="${esc(logoFor(p))}" alt="" onerror="this.remove()">${esc([p.school, p.pos, p.cls, isPast() ? draftMeta(p) : p.height].filter(Boolean).join(' · '))}</span>
    </span>
    <span class="pr-cell"><span class="pr-pos">${esc(p.pos || '—')}</span></span>
    <span class="pr-cell">${esc(p.cls || '—')}</span>
    ${isPast() ? draftCell(p) : `<span class="pr-cell pr-size">${esc(size)}</span>`}
    <span class="pr-cell pr-age" style="--h:${hue == null ? 0 : hue}" title="Age on draft night">${age}</span>
    <span class="pr-school">
      <img src="${esc(logoFor(p))}" alt="" loading="lazy" onerror="this.onerror=null;this.src='${initialsBadge(p.school || '?')}'">
      <span>${esc(p.school || '—')}${schoolSub ? `<small>${esc(schoolSub)}</small>` : ''}</span>
    </span>
  </button>
  <div class="pr-detail" id="d-${p.id}"${open ? '' : ' hidden'}>${open ? detailHTML(p) : ''}</div>
</article>`;
  }

  function detailHTML(p) {
    const { facts, report, lists } = detailFacts(p);
    const stats = statsHTML(p);
    const film = p.film ? `<a class="btn btn-ghost btn-sm" href="${esc(p.film)}" target="_blank" rel="noopener">Watch film</a>` : '';
    return `
<img class="pr-bigphoto" src="${esc(photoFor(p))}" alt="${esc(p.name)}" loading="lazy" onerror="this.onerror=null;this.src='${initialsBadge(p.name)}'">
<div>
  <dl class="pr-facts">${facts.map(([k, v, html]) => `<div><dt>${k}</dt><dd>${html || esc(v)}</dd></div>`).join('')}</dl>
  <h4>${esc(p.archetype || 'Scouting report')}</h4>
  ${report}
  ${lists}
  ${stats}
  <div class="pr-actions">
    ${film}
    <button class="btn btn-ghost btn-sm" type="button" data-copy="${p.id}">Copy link</button>
  </div>
</div>`;
  }

  function detailFacts(p) {
    const facts = [
      ['Board rank', p.rank != null ? `#${p.rank}` : (isPast() ? 'Unranked' : 'On the radar')],
      ['Drafted', isPast() ? draftLong(p) : '', isPast() ? draftFact(p) : ''],
      ['Tier', p.tier != null ? [p.tier, BOARD.tierName(p.tier)].filter(Boolean).join(' · ') : '—'],
      ['Position', p.pos],
      ['Class', CLASS_LABEL[p.cls] || p.cls],
      ['Height', p.height],
      ['Weight', p.weight ? `${p.weight} lbs` : ''],
      ['Wingspan', p.wingspan],
      ['Draft-night age', p.age != null ? p.age.toFixed(1) : ''],
      ['Born', p.dob],
      ['School', p.isPro ? 'Professional' : p.school],
      ['Conference', p.conference],
      ['Previous rank', state.hasPrev && p.prevRank != null ? `#${p.prevRank}` : ''],
      ['NBA comparison', p.comp]
    ].filter(([, v]) => v !== '' && v != null);

    const report = p.scouting
      ? `<p class="pr-report">${esc(p.scouting)}</p>`
      : `<p class="pr-note">Full scouting report coming soon.</p>`;

    const lists = (p.strengths.length || p.weaknesses.length) ? `
  <div class="pr-lists">
    ${p.strengths.length ? `<div class="pr-list plus"><h5>Strengths</h5><ul>${p.strengths.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    ${p.weaknesses.length ? `<div class="pr-list minus"><h5>Weaknesses</h5><ul>${p.weaknesses.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
  </div>` : '';

    return { facts, report, lists };
  }

  // Stats as a Basketball-Reference-style table: one row per season,
  // oldest first, grouped column headers above.
  function statsHTML(p) {
    const credited = p.seasons.some(s => s.source === 'bbref' && s.url && p.statsLink.startsWith(s.url));
    const link = p.statsLink && !credited ? `<a class="pr-source" href="${esc(p.statsLink)}" target="_blank" rel="noopener">Full stats</a>` : '';
    if (!p.hasStats) {
      if (isPast()) return link ? `<div class="pr-stats-foot" style="margin-top:1rem">${link}</div>` : '';
      const what = p.isPro ? 'Professional stats' : `${BOARD.CURRENT_SEASON} stats`;
      return `<p class="pr-note" style="margin-top:1rem">${what} will appear here once the season is underway.${link ? ` ${link}` : ''}</p>`;
    }
    const seasons = [...p.seasons].reverse();
    const groups = BOARD.STAT_GROUPS.map(g => ({ ...g, stats: g.stats.filter(([k]) => seasons.some(s => s.stats[k] != null)) }))
      .filter(g => g.stats.length);
    const cols = groups.flatMap(g => g.stats);
    const teamOf = s => s.team || (p.isPro ? 'Pro' : p.school) || '';
    const rows = seasons.map(s => `
        <tr>
          <th scope="row">${esc(s.label)}</th>
          <td class="st-team" title="${esc(teamOf(s))}">${esc(teamOf(s))}</td>
          ${cols.map(([k]) => `<td>${s.stats[k] != null ? esc(s.stats[k]) : ''}</td>`).join('')}
        </tr>`).join('');
    const pending = !isPast() && !p.seasons.some(s => s.label === BOARD.CURRENT_SEASON) && p.seasons.some(s => s.label === BOARD.LAST_SEASON)
      ? `<span>${BOARD.CURRENT_SEASON} numbers are added once he's played.</span>` : '';
    const college = p.seasons.find(s => s.source === 'barttorvik');
    const pro = p.seasons.find(s => s.source === 'bbref');
    const source = (college
      ? `<span>College stats via <a class="pr-source" href="https://barttorvik.com/playerstat.php?link=y&year=${college.label.slice(0, 2)}${college.label.slice(-2)}&p=${encodeURIComponent(college.torvikName || p.name)}&t=${encodeURIComponent(college.team || '')}" target="_blank" rel="noopener">Barttorvik</a></span>`
      : '') + (pro
      ? `<span>${/gleague/.test(pro.url) ? 'G League' : 'International'} stats via <a class="pr-source" href="${esc(pro.url)}" target="_blank" rel="noopener">Basketball-Reference</a></span>`
      : '');
    return `
  <div class="pr-stats">
    <div class="st-scroll" tabindex="0" role="region" aria-label="${esc(p.name)} stats">
      <table class="st-table">
        <thead>
          <tr class="st-over"><th colspan="2"></th>${groups.map(g => `<th colspan="${g.stats.length}" scope="colgroup">${esc(g.title)}</th>`).join('')}</tr>
          <tr><th scope="col">Season</th><th scope="col" class="st-team">Team</th>${cols.map(([, label]) => `<th scope="col">${label}</th>`).join('')}</tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${pending || source || link ? `<div class="pr-stats-foot">${pending}${source}${link}</div>` : ''}
  </div>`;
  }

  // Groups a list into tier sections, keeping board order within each.
  function tieredHTML(list) {
    let out = '', current;
    list.forEach(p => {
      if (p.tier !== current) {
        current = p.tier;
        const n = list.filter(x => x.tier === current).length;
        const name = BOARD.tierName(current);
        out += `<div class="tier-head" style="--tier:${tierColor(current)}"><b>${tierLabel(current)}</b>${name ? `<em>${esc(name)}</em>` : ''}<span>${n} ${n === 1 ? 'prospect' : 'prospects'}</span></div>`;
      }
      out += rowHTML(p);
    });
    return out;
  }

  // ------------------------------------------------------------ filtering
  function matches(p) {
    if (state.pos !== 'ALL' && p.pos !== state.pos) return false;
    if (state.cls !== 'ALL' && p.cls !== state.cls) return false;
    if (state.q) {
      const hay = `${p.name} ${p.school} ${p.archetype} ${p.conference}`.toLowerCase();
      if (!hay.includes(state.q)) return false;
    }
    return true;
  }

  function render() {
    const shown = state.all.filter(matches);
    const ranked = shown.filter(p => p.rank != null);
    const radar = shown.filter(p => p.rank == null);
    const filtering = state.q || state.pos !== 'ALL' || state.cls !== 'ALL';

    document.getElementById('board').innerHTML = ranked.length
      ? tieredHTML(ranked)
      : `<div class="board-empty">No ranked prospects match these filters.</div>`;

    const wrap = document.getElementById('radarWrap');
    const radarEl = document.getElementById('radar');
    const toggle = document.getElementById('radarToggle');
    wrap.hidden = radar.length === 0;
    // While filtering, radar matches are shown directly so nothing is
    // hidden behind a button.
    const openRadar = state.radarOpen || (filtering && radar.length > 0);
    radarEl.hidden = !openRadar;
    radarEl.innerHTML = openRadar ? tieredHTML(radar) : '';
    toggle.hidden = !!filtering;
    toggle.textContent = state.radarOpen ? (isPast() ? 'Hide unranked prospects' : 'Hide prospects on the radar') : `Show ${radar.length} more prospects`;
    toggle.setAttribute('aria-expanded', String(state.radarOpen));

    const total = state.all.length;
    document.getElementById('boardCount').textContent = filtering ? `${shown.length} of ${total} prospects` : '';
  }

  function chips(el, values, key, labels) {
    el.innerHTML = ['ALL', ...values].map(v =>
      `<button type="button" class="chip${state[key] === v ? ' active' : ''}" data-${key}="${v}">${v === 'ALL' ? 'All' : (labels ? labels[v] || v : v)}</button>`).join('');
  }
  function renderChips() {
    chips(document.getElementById('posChips'), POSITIONS, 'pos');
    chips(document.getElementById('classChips'), CLASSES, 'cls', { INTL: 'Intl' });
  }

  function renderSummary() {
    const ranked = state.all.filter(p => p.rank != null);
    if (isPast()) {
      // How the board's ranked prospects actually went in that draft.
      const picked = ranked.filter(p => p.draft && p.draft.pick != null && p.draft.year === state.year);
      const firstRound = picked.filter(p => p.draft.round === 1).length;
      document.getElementById('boardSummary').innerHTML = `
        <div><b>${ranked.length}</b><span>Ranked</span></div>
        <div><b>${picked.length}</b><span>Drafted</span></div>
        <div><b>${firstRound}</b><span>First round</span></div>`;
      return;
    }
    const fr = ranked.filter(p => p.cls === 'FR').length;
    const intl = ranked.filter(p => p.cls === 'INTL').length;
    document.getElementById('boardSummary').innerHTML = `
      <div><b>${ranked.length}</b><span>Ranked</span></div>
      <div><b>${fr}</b><span>Freshmen</span></div>
      <div><b>${intl}</b><span>International</span></div>`;
  }

  // ------------------------------------------------------------ interaction
  // Past boards live at draft.html?year=2025 (plus #prospect for a profile).
  const pageUrl = hash => location.pathname + (isPast() ? `?year=${state.year}` : '') + (hash ? `#${hash}` : '');

  function toggleProspect(id, scroll) {
    state.openId = state.openId === id ? null : id;
    const p = state.all.find(x => x.id === id);
    if (p && p.rank == null) state.radarOpen = true;
    render();
    history.replaceState(null, '', pageUrl(state.openId));
    if (scroll && state.openId) {
      const el = document.getElementById(`p-${state.openId}`);
      if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }
  }

  document.addEventListener('click', e => {
    const row = e.target.closest('.pr-main');
    if (row) return toggleProspect(row.dataset.id, false);
    const pos = e.target.closest('[data-pos]');
    if (pos) { state.pos = pos.dataset.pos; renderChips(); return render(); }
    const cls = e.target.closest('[data-cls]');
    if (cls) { state.cls = cls.dataset.cls; renderChips(); return render(); }
    if (e.target.closest('#radarToggle')) { state.radarOpen = !state.radarOpen; return render(); }
    const yr = e.target.closest('[data-year]');
    if (yr) { e.preventDefault(); return showYear(+yr.dataset.year, { push: true }); }
    if (e.target.closest('#tierInfoBtn')) return setTierInfo(document.getElementById('tierInfo').hidden);
    if (!e.target.closest('#tierInfo')) setTierInfo(false);
    const copy = e.target.closest('[data-copy]');
    if (copy) {
      const url = location.origin + pageUrl(copy.dataset.copy);
      (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject())
        .then(() => { copy.textContent = 'Link copied'; setTimeout(() => { copy.textContent = 'Copy link'; }, 1600); })
        .catch(() => prompt('Copy this link:', url));
    }
  });

  // Following a #prospect link while already on the board opens that profile.
  window.addEventListener('hashchange', () => {
    const id = decodeURIComponent(location.hash.slice(1));
    if (id && id !== state.openId && state.all.some(p => p.id === id)) toggleProspect(id, true);
  });

  let t;
  document.getElementById('boardSearch').addEventListener('input', e => {
    clearTimeout(t);
    t = setTimeout(() => { state.q = e.target.value.trim().toLowerCase(); render(); }, 120);
  });

  // ------------------------------------------------------------ tier guide
  function setTierInfo(open) {
    const panel = document.getElementById('tierInfo');
    const btn = document.getElementById('tierInfoBtn');
    if (open && !panel.innerHTML) {
      panel.innerHTML = `<h3>How the tiers work</h3>
        <p>Each tier is BYTHERIM's projection of a prospect's outcome in the NBA.</p>
        <ol class="tier-list">${Object.keys(BOARD.TIERS).map(k =>
          `<li style="--tier:${tierColor(k === '?' ? '?' : +k)}"><b>${k === '?' ? '?' : 'Tier ' + k}</b><span>${esc(BOARD.TIERS[k])}</span></li>`).join('')}</ol>`;
    }
    panel.hidden = !open;
    btn.setAttribute('aria-expanded', String(open));
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setTierInfo(false); });

  // ------------------------------------------------------------ boards
  function renderYears() {
    const nav = document.getElementById('yearChips');
    nav.hidden = state.boards.length < 2;
    nav.innerHTML = state.boards.map(b =>
      `<a href="${b.current ? location.pathname : `?year=${b.year}`}" class="chip${b.year === state.year ? ' active' : ''}" data-year="${b.year}"${b.year === state.year ? ' aria-current="page"' : ''}>${b.year}</a>`).join('');
  }

  function renderHead() {
    const y = state.year;
    document.getElementById('boardEyebrow').textContent = isPast() ? `${y} NBA Draft · Final board` : `${y} NBA Draft`;
    document.getElementById('boardIntro').textContent = isPast()
      ? `BYTHERIM's final board for the ${y} class, with where each prospect was actually drafted. Select a prospect to see his profile.`
      : `BYTHERIM's rankings of the ${y} class, grouped by tier. Select a prospect to see his profile.`;
    document.getElementById('colSize').textContent = isPast() ? 'Drafted' : 'HT / WT';
    document.getElementById('radarIntro').textContent = isPast()
      ? `Prospects BYTHERIM tracked for ${y} but left off the ranked board, grouped by tier.`
      : 'Prospects outside the top 60 that BYTHERIM is still tracking, grouped by tier.';
    document.title = `${y} NBA Draft Big Board | BYTHERIM`;
    document.querySelector('main').classList.toggle('past-board', isPast());
  }

  let loadToken = 0;
  function showYear(year, { push = false, openHash = '' } = {}) {
    if (!state.boards.some(b => b.year === year)) year = BOARD.draftYear;
    const token = ++loadToken;
    state.year = year;
    state.openId = null;
    state.radarOpen = false;
    state.season = {};
    renderYears();
    renderHead();
    if (push) history.pushState({ year }, '', pageUrl(''));
    document.getElementById('board').innerHTML = '<div class="skeleton" style="height:64px;margin-bottom:.4rem"></div><div class="skeleton" style="height:64px"></div>';
    document.getElementById('boardSummary').innerHTML = '';
    return BOARD.loadBoard(year).then(rows => {
      if (token !== loadToken) return;
      state.all = rows;
      state.hasPrev = rows.some(p => p.prevRank != null);
      renderChips();
      renderSummary();
      if (openHash && rows.some(p => p.id === openHash)) toggleProspect(openHash, true);
      else render();
    }).catch(err => {
      if (token !== loadToken) return;
      console.error(err);
      document.getElementById('board').innerHTML = isPast()
        ? `<div class="empty-state">The ${year} board couldn't be loaded right now. <a href="${location.pathname}">Back to the ${BOARD.draftYear} board</a>.</div>`
        : `<div class="empty-state">The big board couldn't be loaded right now. Check that the board's Google Sheet is still published to the web, then refresh.</div>`;
    });
  }

  window.addEventListener('popstate', () => {
    const y = parseInt(new URLSearchParams(location.search).get('year'), 10) || BOARD.draftYear;
    if (y !== state.year) showYear(y, { openHash: decodeURIComponent(location.hash.slice(1)) });
  });

  // ------------------------------------------------------------ load
  (async () => {
    const wanted = parseInt(new URLSearchParams(location.search).get('year'), 10) || BOARD.draftYear;
    const hash = decodeURIComponent(location.hash.slice(1));
    const filled = BOARD.listFilledBoards().catch(() => state.boards);
    if (wanted !== BOARD.draftYear) state.boards = await filled;
    else filled.then(boards => { state.boards = boards; renderYears(); });
    showYear(wanted, { openHash: hash });
  })();
})();
</script>
</body>
</html>
