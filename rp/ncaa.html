<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCAA Engine | BYTHERIM</title>
  <style>
    /* Base Styles & BYTHERIM Color Scheme */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0a0a0e;
      color: #ffffff;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .header-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111118;
      padding: 1.5rem 2rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 2rem;
    }

    .engine-info h1 { margin: 0 0 0.5rem 0; font-size: 1.8rem; text-transform: uppercase; }
    .engine-info p { margin: 0; color: #a1a5b8; font-weight: 600; }
    .highlight { color: #38bdf8; }

    .controls { display: flex; gap: 1rem; }
    
    button {
      background: #38bdf8;
      color: #0a0a0e;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.2s;
    }
    button:hover { background: #1da1f2; }
    
    .btn-secondary { background: #2a2d3d; color: #fff; }
    .btn-secondary:hover { background: #3f445e; }

    /* News Feed */
    .news-container {
      background: #111118;
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 2rem;
      max-height: 150px;
      overflow-y: auto;
    }
    .news-item {
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: #a1a5b8;
      font-size: 0.95rem;
    }

    /* Main Table Styles */
    .table-wrapper {
      background: #111118;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow-x: auto;
    }
    
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 1rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
    th { color: #7d8296; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
    
    .clickable-school { cursor: pointer; color: #38bdf8; font-weight: 700; transition: color 0.2s; }
    .clickable-school:hover { color: #fff; text-decoration: underline; }

    /* Modal / Team Hub Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active { display: flex; }

    .modal-content {
      background: #0a0a0e;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      width: 90%;
      max-width: 900px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 2.5rem;
      position: relative;
      box-shadow: 0 25px 50px rgba(0,0,0,0.8);
    }

    .close-btn {
      position: absolute;
      top: 1.5rem; right: 1.5rem;
      background: transparent;
      border: none;
      color: #7d8296;
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
      padding: 0;
    }
    .close-btn:hover { color: #fff; background: transparent; }

    .team-header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 1.5rem;
    }

    .team-logo { width: 100px; height: 100px; object-fit: contain; }
    
    .ap-rank {
      background: #38bdf8;
      color: #000;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 1.2rem;
      display: none;
    }

    .team-stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-box {
      background: #111118;
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
    }

    .stat-label { display: block; color: #7d8296; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.5rem; }
    .stat-value { display: block; color: #fff; font-size: 1.75rem; font-weight: 800; }

    /* Future-Proof Draft Projections */
    .draft-projection {
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .draft-projection.active-link { cursor: pointer; }
    .draft-projection.active-link:hover { background: #38bdf8; color: #0a0a0e; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-panel">
      <div class="engine-info">
        <h1>NCAA Dynasty Engine</h1>
        <p>Year: <span id="currentYearDisplay" class="highlight">2028</span> | Phase: <span id="currentPhaseDisplay" class="highlight">Preseason</span></p>
      </div>
      <div class="controls">
        <button onclick="SimEngine.simulateSeason()">Simulate Season</button>
        <button class="btn-secondary" onclick="SimEngine.runOffseason()">Advance Offseason</button>
      </div>
    </div>

    <div class="news-container" id="newsFeed">
      <!-- Status updates inject here -->
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Name</th>
            <th>Pos</th>
            <th>Class</th>
            <th>School</th>
            <th>MPG</th>
            <th>PPG</th>
            <th>RPG</th>
            <th>APG</th>
            <th>BPM</th>
          </tr>
        </thead>
        <tbody id="statsBody">
          <!-- Main Player Leaderboard injects here -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- TEAM HUB MODAL -->
  <div id="teamModal" class="modal-overlay">
    <div class="modal-content">
      <button class="close-btn" onclick="SimEngine.closeTeamModal()">&times;</button>
      
      <div class="team-header">
        <img id="modalTeamLogo" src="" alt="Team Logo" class="team-logo">
        <div class="team-title-block">
          <div style="display: flex; align-items: center; gap: 0.75rem;">
            <span id="modalTeamRank" class="ap-rank"></span>
            <h2 id="modalTeamName" style="margin: 0; font-size: 2.5rem; color: #fff; text-transform: uppercase;"></h2>
          </div>
          <span id="modalTeamYear" style="color: #38bdf8; font-weight: 700; font-size: 1.2rem;"></span>
        </div>
      </div>

      <div class="team-stats-grid">
        <div class="stat-box">
          <span class="stat-label">OVERALL</span>
          <span id="modalTeamRecord" class="stat-value">0-0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">CONF</span>
          <span id="modalConfRecord" class="stat-value">0-0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">TEAM PPG</span>
          <span id="modalTeamPPG" class="stat-value">0.0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">OPP PPG</span>
          <span id="modalOppPPG" class="stat-value">0.0</span>
        </div>
      </div>

      <h3 style="color: #fff; margin-bottom: 1rem; text-transform: uppercase;">Active Roster</h3>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Pos</th>
              <th>Class</th>
              <th>HT</th>
              <th>WT</th>
              <th>From</th>
              <th>Draft</th>
            </tr>
          </thead>
          <tbody id="modalRosterBody">
            <!-- Team Roster injects here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Link to the Javascript engine -->
  <script src="./js/ncaa-engine.js"></script>
</body>
</html>
