  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- External Libraries -->

  <!-- Shared BYTHERIM header and footer (assets/chrome.css + site.js; the
       site's theme button and saved theme apply here too), then the
       recruiting page's own styles. -->
  <link rel="stylesheet" href="../assets/chrome.css">
  <link rel="stylesheet" href="style.css">
  <script src="../assets/site.js"></script>
</head>
<body>

  <script>BTR.mount('rp', { base: '../' })</script>
<script src="../rp/js/cloud-config.js"></script>
<script src="../rp/js/cloud.js"></script>

  <!-- Recruiting sub-header: the section logo sits large on the left with
       the section's own tabs beside it, the way a recruiting site reads. -->
  <div class="recruiting-header">
    <div class="recruiting-brand" onclick="switchTab('rankings')" title="Recruiting home">
      <img src="recruitingrplogo.png" alt="BYTHERIM Recruiting" class="recruiting-logo-img"
           onerror="this.style.display='none';">
    </div>
    <nav class="recruiting-nav">
      <button class="nav-btn active" onclick="switchTab('rankings')">Class Rankings</button>
      <button class="nav-btn" onclick="switchTab('schoolRankings')">School Rankings</button>
      <button class="nav-btn" onclick="switchTab('stats')">Statistics</button>
      <button class="nav-btn" onclick="switchTab('portal')">Transfer Portal</button>
      <button class="nav-btn" onclick="switchTab('summer')">Summer Circuit</button>
    </nav>
  </div>
  <!-- END OF UPDATED HEADER -->

  <div class="container">
    <!-- GLOBAL BACK BUTTON -->
    <button id="globalBackBtn" class="back-btn" onclick="goBack()" style="display: none; margin-bottom: 1.25rem;">← Go Back</button>

    <div id="rankings-tab" class="tab-content active">
      <div class="controls-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Search player or school..." onkeyup="filterRecruits()">
        <div class="filter-group">
          <select id="classFilter" class="select-input" onchange="filterRecruits()">
            <option value="OVERALL">Overall Rankings (All Classes)</option>
            <option value="2028" selected>Class of 2028</option>
            <option value="2029">Class of 2029</option>
            <option value="2030">Class of 2030</option>
            <option value="2031">Class of 2031</option>
            <option value="2032">Class of 2032</option>
            <option value="2033">Class of 2033</option>
            <option value="2034">Class of 2034</option>
            <option value="2035">Class of 2035</option>
            <option value="2036">Class of 2036</option>
            <option value="2037">Class of 2037</option>
            <option value="2038">Class of 2038</option>
            <option value="2039">Class of 2039</option>
            <option value="2040">Class of 2040</option>
          </select>
          <select id="stateFilter" class="select-input" onchange="filterRecruits()">
            <option value="ALL">All States / Regions</option>
            <option value="INT">International</option>
            <option value="AL">Alabama (AL)</option><option value="AK">Alaska (AK)</option><option value="AZ">Arizona (AZ)</option><option value="AR">Arkansas (AR)</option>
            <option value="CA">California (CA)</option><option value="CO">Colorado (CO)</option><option value="CT">Connecticut (CT)</option><option value="DE">Delaware (DE)</option>
            <option value="DC">Washington, D.C. (DC)</option>
            <option value="FL">Florida (FL)</option><option value="GA">Georgia (GA)</option><option value="HI">Hawaii (HI)</option><option value="ID">Idaho (ID)</option>
            <option value="IL">Illinois (IL)</option><option value="IN">Indiana (IN)</option><option value="IA">Iowa (IA)</option><option value="KS">Kansas (KS)</option>
            <option value="KY">Kentucky (KY)</option><option value="LA">Louisiana (LA)</option><option value="ME">Maine (ME)</option><option value="MD">Maryland (MD)</option>
            <option value="MA">Massachusetts (MA)</option><option value="MI">Michigan (MI)</option><option value="MN">Minnesota (MN)</option><option value="MS">Mississippi (MS)</option>
            <option value="MO">Missouri (MO)</option><option value="MT">Montana (MT)</option><option value="NE">Nebraska (NE)</option><option value="NV">Nevada (NV)</option>
            <option value="NH">New Hampshire (NH)</option><option value="NJ">New Jersey (NJ)</option><option value="NM">New Mexico (NM)</option><option value="NY">New York (NY)</option>
            <option value="NC">North Carolina (NC)</option><option value="ND">North Dakota (ND)</option><option value="OH">Ohio (OH)</option><option value="OK">Oklahoma (OK)</option>
            <option value="OR">Oregon (OR)</option><option value="PA">Pennsylvania (PA)</option><option value="RI">Rhode Island (RI)</option><option value="SC">South Carolina (SC)</option>
            <option value="SD">South Dakota (SD)</option><option value="TN">Tennessee (TN)</option><option value="TX">Texas (TX)</option><option value="UT">Utah (UT)</option>
            <option value="VT">Vermont (VT)</option><option value="VA">Virginia (VA)</option><option value="WA">Washington (WA)</option><option value="WV">West Virginia (WV)</option>
            <option value="WI">Wisconsin (WI)</option><option value="WY">Wyoming (WY)</option>
          </select>
          <select id="posFilter" class="select-input" onchange="filterRecruits()">
            <option value="ALL">All Positions</option>
            <option value="PG">Point Guard (PG)</option>
            <option value="CG">Combo Guard (CG)</option>
            <option value="SG">Shooting Guard (SG)</option>
            <option value="SF">Small Forward (SF)</option>
            <option value="PF">Power Forward (PF)</option>
            <option value="C">Center (C)</option>
          </select>
          <select id="starFilter" class="select-input" onchange="filterRecruits()">
            <option value="ALL">All Star Ratings</option>
            <option value="5">5-Star Prospects</option>
            <option value="4">4-Star Prospects</option>
            <option value="3">3-Star Prospects</option>
          </select>
          <select id="commitFilter" class="select-input" onchange="filterRecruits()">
            <option value="ALL">Any Commit Status</option>
            <option value="COMMITTED">Committed</option>
            <option value="UNCOMMITTED">Uncommitted</option>
          </select>
        </div>
      </div>
      <div id="classSummary" class="class-summary" hidden></div>
      <div class="table-container">
        <table id="rankingsTable" class="recruit-table">
          <thead>
            <tr>
              <th class="col-rank">Rank</th>
              <th class="col-player" style="text-align: left;">Player</th>
              <th class="col-class">Class</th>
              <th class="col-pos">Pos</th>
              <th class="col-htwt">HT / WT</th>
              <th class="col-state">State</th>
              <th class="col-hs">High School / Club</th>
              <th class="col-grade">Rating</th>
              <th class="col-commit" style="text-align: left;">Commit</th>
            </tr>
          </thead>
          <tbody id="recruitsTableBody"></tbody>
        </table>
      </div>
    </div>

    <div id="schoolRankings-tab" class="tab-content">
      <div class="controls-bar">
        <div class="filter-group" style="width: 100%; justify-content: flex-start;">
          <input type="text" id="schoolSearchInput" class="search-input" placeholder="Search school..." onkeyup="renderSchoolRankings()">
          <select id="schoolRankingsYearFilter" class="select-input" onchange="renderSchoolRankings()" style="min-width: 260px;">
            <option value="ALL">All Time Class (Overall)</option>
            <option value="2028" selected>Class of 2028</option>
            <option value="2029">Class of 2029</option>
            <option value="2030">Class of 2030</option>
            <option value="2031">Class of 2031</option>
            <option value="2032">Class of 2032</option>
            <option value="2033">Class of 2033</option>
            <option value="2034">Class of 2034</option>
            <option value="2035">Class of 2035</option>
            <option value="2036">Class of 2036</option>
            <option value="2037">Class of 2037</option>
            <option value="2038">Class of 2038</option>
            <option value="2039">Class of 2039</option>
            <option value="2040">Class of 2040</option>
          </select>
        </div>
      </div>
      <div class="table-container">
        <table id="schoolRankingsTable" class="school-table">
          <thead>
            <tr>
              <th class="col-srank">Rank</th>
              <th class="col-school" style="text-align: left;">School</th>
              <th class="col-commits">Commits</th>
              <th class="col-breakdown">5★ / 4★ / 3★</th>
              <th class="col-sgrade" title="Points for every commit's rating, the best counting most">Class Score</th>
            </tr>
          </thead>
          <tbody id="schoolRankingsTableBody"></tbody>
        </table>
      </div>
    </div>

    <div id="stats-tab" class="tab-content">
      <div class="stats-controls-bar">
        <div class="sub-nav-group" id="levelTabs">
          <button class="sub-nav-btn active" onclick="setStatLevel('hs', this)">High School</button>
          <button class="sub-nav-btn" onclick="setStatLevel('aau', this)">AAU</button>
          <button class="sub-nav-btn" onclick="setStatLevel('fiba', this)">FIBA</button>
          <button class="sub-nav-btn" onclick="setStatLevel('intl', this)">International</button>
        </div>
        <div class="pos-filter-wrapper">
          <span class="pos-filter-label">POS:</span>
          <div class="pos-pill-group">
            <button class="pos-pill active" onclick="togglePosFilter('PG', this)">PG</button>
            <button class="pos-pill active" onclick="togglePosFilter('CG', this)">CG</button>
            <button class="pos-pill active" onclick="togglePosFilter('SG', this)">SG</button>
            <button class="pos-pill active" onclick="togglePosFilter('SF', this)">SF</button>
            <button class="pos-pill active" onclick="togglePosFilter('PF', this)">PF</button>
            <button class="pos-pill active" onclick="togglePosFilter('C', this)">C</button>
          </div>
          <button class="sub-nav-btn" style="margin-left: 8px;" onclick="toggleAllPositions()">Toggle All</button>
        </div>
        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
          <input type="text" id="statsSearchInput" class="search-input" placeholder="Search player..." onkeyup="renderStatsDashboard()">
          <select id="statsClassFilter" class="select-input" onchange="renderStatsDashboard()">
            <option value="ALL">All Classes</option>
            <option value="2028" selected>Class of 2028</option><option value="2029">Class of 2029</option><option value="2030">Class of 2030</option><option value="2031">Class of 2031</option>
            <option value="2032">Class of 2032</option><option value="2033">Class of 2033</option><option value="2034">Class of 2034</option><option value="2035">Class of 2035</option>
            <option value="2036">Class of 2036</option><option value="2037">Class of 2037</option><option value="2038">Class of 2038</option><option value="2039">Class of 2039</option><option value="2040">Class of 2040</option>
          </select>
          <div class="sub-nav-group" id="modeTabs">
            <button class="sub-nav-btn active" onclick="setStatMode('per_game', this)">Per Game</button>
            <button class="sub-nav-btn" onclick="setStatMode('per_40', this)">Per 40 Min</button>
            <button class="sub-nav-btn" onclick="setStatMode('per_75', this)">Per 75 Poss</button>
            <button class="sub-nav-btn" onclick="setStatMode('per_100', this)">Per 100 Poss</button>
          </div>
          <div class="sub-nav-group" id="viewTabs">
            <button class="sub-nav-btn active" onclick="setStatView('basic', this)">Basic Stats</button>
            <button class="sub-nav-btn" onclick="setStatView('advanced', this)">Advanced Stats</button>
            <button class="sub-nav-btn" onclick="setStatView('shooting', this)">Shooting</button>
          </div>
        </div>
      </div>
      <div class="query-builder-box">
        <div class="query-builder-header">
          <div style="display: flex; align-items: center; gap: 10px;">
            <strong style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;">Query Search & Heatmap Filter</strong>
            <span id="queryEngagedBadge" class="query-badge">OFF</span>
          </div>
          <div style="display: flex; gap: 8px;">
            <button class="query-btn" onclick="addQueryRule()">+ Add Stat Rule</button>
            <button class="query-btn query-btn-danger" onclick="clearQueryRules()">Clear Rules</button>
            <button id="toggleQueryBtn" class="query-btn query-btn-toggle" onclick="toggleQueryEngage()">Engage Query Search</button>
          </div>
        </div>
        <div id="queryRulesContainer"></div>
      </div>
      <div class="table-container">
        <table>
          <thead id="statsTableHeader"></thead>
          <tbody id="statsTableBody"></tbody>
        </table>
      </div>
    </div>

    <div id="portal-tab" class="tab-content">
      <div class="controls-bar">
        <input type="text" id="portalSearch" class="search-input" placeholder="Search player or school..." oninput="setPortalFilter('q', this.value)">
        <div class="filter-group">
          <select id="portalSeason" class="select-input" aria-label="Season" onchange="setPortalFilter('season', this.value)">
            <option value="ALL">All Seasons</option>
          </select>
          <select id="portalType" class="select-input" aria-label="Type" onchange="setPortalFilter('type', this.value)">
            <option value="ALL">Scheduled &amp; Portal</option>
            <option value="SCHEDULED">Scheduled (roster sheet)</option>
            <option value="PORTAL">Portal (simulation)</option>
          </select>
          <select id="portalPos" class="select-input" aria-label="Position" onchange="setPortalFilter('pos', this.value)">
            <option value="ALL">All Positions</option>
            <option value="G">Guard (G)</option><option value="W">Wing (W)</option><option value="F">Forward (F)</option><option value="C">Center (C)</option>
            <option value="PG">PG</option><option value="CG">CG</option><option value="SG">SG</option><option value="SF">SF</option><option value="PF">PF</option>
          </select>
        </div>
      </div>
      <div class="portal-summary" id="portalSummary"></div>
      <div class="table-container">
        <table class="portal-table">
          <thead>
            <tr>
              <th class="col-player" style="text-align: left;">Player</th>
              <th class="col-grade">OVR</th>
              <th class="col-move" style="text-align: left;">Move</th>
              <th class="col-season">Season</th>
              <th class="col-type">Type</th>
            </tr>
          </thead>
          <tbody id="portalBody"><tr><td colspan="5" class="portal-empty">Loading transfers…</td></tr></tbody>
        </table>
      </div>
    </div>

    <div id="summer-tab" class="tab-content">
      <div id="summerContainer"><p class="portal-empty">Loading the summer circuit…</p></div>
    </div>

    <div id="profile-tab" class="tab-content">
      <div id="profileContainer" class="profile-card"></div>
    </div>

    <div id="accoladeDetail-tab" class="tab-content">
      <div id="accoladeDetailContainer"></div>
    </div>
  </div>

  <!-- External JavaScript Link -->
  <script src="../rp/js/teams-master.js"></script>
  <script src="../rp/js/roster-gen.js"></script>
  <script src="../rp/js/prestige.js"></script>
  <script src="../rp/js/recruit-gen.js"></script>
  <script src="../rp/js/recruit-sheet.js"></script>
  <!-- The summer circuit is played here, against the NCAA RP save in this browser. -->
  <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
  <script src="../rp/js/db.js"></script>
  <script src="../rp/js/game-core.js"></script>
  <script src="../rp/js/summer-core.js"></script>
  <script src="app.js"></script>
  <script src="portal.js"></script>

  <!-- The shared BYTHERIM footer is added by site.js. -->
</body>
</html>
