<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BYTHERIM | NBA</title>
  
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Asap+Condensed:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Asap Condensed', sans-serif;
      font-size: 1.1rem;
      margin: 0;
    }

    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    /* Page Header Card */
    .header-card {
      background: linear-gradient(180deg, var(--card-bg) 0%, var(--bg-color) 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .header-title h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-main);
      margin: 0;
    }

    .header-title p {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-top: 6px;
    }

    .substack-subscribe-box {
      background: var(--bg-color);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.25rem 0.5rem;
      display: flex;
      align-items: center;
    }

    .substack-subscribe-box iframe {
      border: 0;
      background: transparent;
      height: 50px;
      width: 320px;
    }

    /* Main Two-Column Layout */
    .content-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 2rem;
      align-items: start;
    }

    .articles-feed {
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    /* Substack Post Cards */
    .post-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
    }

    .post-card:hover {
      background-color: var(--card-hover);
      border-color: var(--accent);
      transform: translateY(-3px);
    }

    .post-content {
      padding: 1.75rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .post-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .post-badge {
      color: var(--accent);
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .post-date {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .post-title {
      font-family: 'Oswald', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 0;
      line-height: 1.25;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .post-snippet {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.6;
      margin: 0;
    }

    .fallback-link {
      padding: 1rem 2rem;
      background: var(--bg-color);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .fallback-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    .fallback-link a:hover {
      color: var(--text-main);
    }

    /* Power Rankings Sidebar */
    .power-rankings-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      position: sticky;
      top: 6rem;
    }

    .rankings-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
      margin-bottom: 1rem;
    }

    .rankings-header h2 {
      font-family: 'Oswald', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .rankings-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 1rem;
    }

    .rankings-table th {
      text-align: left;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--border);
    }

    .rankings-table td {
      padding: 0.6rem 0;
      border-bottom: 1px solid rgba(56, 66, 107, 0.4);
    }

    .rank-number {
      font-weight: 800;
      color: var(--accent);
    }

    .stock-up {
      color: #22c55e;
      font-weight: 800;
      font-size: 0.85rem;
    }

    .stock-down {
      color: #ef4444;
      font-weight: 800;
      font-size: 0.85rem;
    }

    .stock-same {
      color: var(--text-muted);
      font-weight: 800;
      font-size: 0.85rem;
    }

    @media (max-width: 900px) {
      .content-layout {
        grid-template-columns: 1fr;
      }

      .power-rankings-card {
        position: static;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <a href="./" class="brand-logo">
      <img src="logo.png" alt="BYTHERIM Logo" class="logo-img">
    </a>
    <nav class="nav-links">
      <a href="podcast.html">Podcast</a>
      <a href="draft.html">Draft</a>
      <a href="nba.html" style="color: var(--text-main); font-weight: 700;">NBA</a>
      <a href="./rp/" class="rp-btn">BYTHERIM RP <span class="badge">SIM</span></a>
    </nav>
  </header>

  <!-- Main Content Container -->
  <div class="container">
    
    <div class="header-card">
      <div class="header-title">
        <h1>NBA ANALYSIS & WRITING</h1>
        <p>Long-form essays, tactical breakdowns, and Substack newsletters</p>
      </div>

      <!-- Substack Inline Subscribe Widget -->
      <div class="substack-subscribe-box">
        <iframe src="https://collindunks.substack.com/embed" scrolling="no"></iframe>
      </div>
    </div>

    <!-- Layout: Substack Feed + Power Rankings Sidebar -->
    <div class="content-layout">
      
      <!-- Automated Substack Articles Feed -->
      <div class="articles-feed" id="articlesFeed">
        <p style="color: var(--text-muted); text-align: center; padding: 3rem 0;">Loading latest articles...</p>
      </div>

      <!-- Live NBA Power Rankings Sidebar -->
      <aside class="power-rankings-card">
        <div class="rankings-header">
          <h2>POWER RANKINGS</h2>
        </div>
        <div id="rankingsContainer">
          <p style="color: var(--text-muted); text-align: center; padding: 1.5rem 0; margin: 0;">Loading rankings...</p>
        </div>
      </aside>

    </div>

  </div>

  <script>
    const SUBSTACK_RSS_URL = 'https://collindunks.substack.com/feed';
    const RSS2JSON_API = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(SUBSTACK_RSS_URL)}`;
    const POWER_RANKINGS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQMJMNBf3_TF9bQZrCrIo1WmJZH0LmM5oc-CRFx4orZyY4GHeVeSpEiKr7366GxcOnX0BZrfW1InNE-/pub?gid=0&single=true&output=csv';

    async function fetchSubstackPosts() {
      const feedContainer = document.getElementById('articlesFeed');
      
      try {
        const response = await fetch(RSS2JSON_API);
        const data = await response.json();

        if (data.status !== 'ok' || !data.items || !data.items.length) {
          feedContainer.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 3rem 0;">No articles found.</p>';
          return;
        }

        feedContainer.innerHTML = '';

        data.items.forEach(post => {
          const pubDate = new Date(post.pubDate).toLocaleDateString('en-US', {
            month: 'short',
            day: 'numeric',
            year: 'numeric'
          });

          const cleanSnippet = post.description
            .replace(/<[^>]*>?/gm, '')
            .replace(/&nbsp;/g, ' ')
            .trim()
            .slice(0, 220) + '...';

          const postCard = document.createElement('article');
          postCard.className = 'post-card';
          postCard.innerHTML = `
            <div class="post-content">
              <div class="post-meta">
                <span class="post-badge">Substack Essay</span>
                <span class="post-date">${pubDate}</span>
              </div>
              <h2 class="post-title">${post.title}</h2>
              <p class="post-snippet">${cleanSnippet}</p>
            </div>
            <div class="fallback-link">
              <span style="color: var(--text-muted); font-size: 0.9rem;">By Collin</span>
              <a href="${post.link}" target="_blank" rel="noopener">Read Full Article on Substack &rarr;</a>
            </div>
          `;

          feedContainer.appendChild(postCard);
        });
      } catch (error) {
        feedContainer.innerHTML = '<p style="color: #ef4444; text-align: center; padding: 3rem 0;">Unable to load Substack posts at this time.</p>';
      }
    }

    async function fetchPowerRankings() {
      const rankingsContainer = document.getElementById('rankingsContainer');

      try {
        const response = await fetch(POWER_RANKINGS_CSV_URL);
        if (!response.ok) throw new Error('Failed to fetch Power Rankings CSV');
        
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        if (!rows.length) {
          rankingsContainer.innerHTML = '<p style="color: var(--text-muted); text-align: center;">No rankings available.</p>';
          return;
        }

        let tableHtml = `
          <table class="rankings-table">
            <thead>
              <tr>
                <th style="width: 20%;">Rank</th>
                <th style="width: 20%; text-align: center;">Stock</th>
                <th style="width: 60%;">Team</th>
              </tr>
            </thead>
            <tbody>
        `;

        rows.forEach(row => {
          const rank = row.Rank || row.rank || '';
          const stockVal = (row.Stock || row.stock || '').trim();
          const team = row.Team || row.team || '';

          let stockIcon = '<span class="stock-same">&mdash;</span>';
          if (stockVal.toLowerCase() === 'up') {
            stockIcon = '<span class="stock-up">&#9650;</span>';
          } else if (stockVal.toLowerCase() === 'down') {
            stockIcon = '<span class="stock-down">&#9660;</span>';
          }

          tableHtml += `
            <tr>
              <td class="rank-number">#${rank}</td>
              <td style="text-align: center;">${stockIcon}</td>
              <td style="font-weight: 600; color: var(--text-main);">${team}</td>
            </tr>
          `;
        });

        tableHtml += '</tbody></table>';
        rankingsContainer.innerHTML = tableHtml;

      } catch (error) {
        console.error("Power Rankings Fetch Error:", error);
        rankingsContainer.innerHTML = '<p style="color: #ef4444; text-align: center; padding: 1rem 0;">Unable to load rankings.</p>';
      }
    }

    function parseCSV(csvData) {
      const lines = csvData.split(/\r?\n/);
      const result = [];
      if (lines.length === 0) return result;

      const headers = lines[0].split(',').map(h => h.trim().replace(/(^"|"$)/g, ''));

      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;

        let rowValues = [];
        let inQuotes = false;
        let currentValue = '';

        for (let char of lines[i]) {
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            rowValues.push(currentValue.trim());
            currentValue = '';
          } else {
            currentValue += char;
          }
        }
        rowValues.push(currentValue.trim());

        let obj = {};
        headers.forEach((header, index) => {
          obj[header] = rowValues[index] ? rowValues[index].replace(/(^"|"$)/g, '') : '';
        });
        result.push(obj);
      }
      return result;
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchSubstackPosts();
      fetchPowerRankings();
    });
  </script>

</body>
</html>
