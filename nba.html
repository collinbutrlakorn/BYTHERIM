<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBA Analysis & Power Rankings | BYTHERIM</title>
  <meta name="description" content="NBA essays, podcast breakdowns, and BYTHERIM's power rankings.">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://collinbutrlakorn.github.io/BYTHERIM/nba.html">
  <meta property="og:title" content="NBA Analysis & Power Rankings | BYTHERIM">
  <meta property="og:description" content="NBA essays, podcast breakdowns, and BYTHERIM's power rankings.">
  <meta property="og:image" content="https://collinbutrlakorn.github.io/BYTHERIM/logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="NBA Analysis & Power Rankings | BYTHERIM">
  <meta name="twitter:description" content="NBA essays, podcast breakdowns, and BYTHERIM's power rankings.">
  <meta name="twitter:image" content="https://collinbutrlakorn.github.io/BYTHERIM/logo.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Asap+Condensed:wght@400;500;600;700&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/site.js"></script>
</head>
<body>
<script>BTR.mount('nba')</script>

<main class="container">
  <header class="page-head">
    <span class="eyebrow">NBA</span>
    <h1>Analysis &amp; Rankings</h1>
    <p>Essays and podcast breakdowns from the BYTHERIM Substack, plus weekly power rankings.</p>
  </header>

  <div class="nba-layout">
    <section aria-label="Posts">
      <div class="chip-group" id="typeChips" style="margin-bottom:1rem">
        <button type="button" class="chip active" data-type="all">All</button>
        <button type="button" class="chip" data-type="article">Articles</button>
        <button type="button" class="chip" data-type="podcast">Podcast</button>
      </div>
      <div class="feed-list" id="feed">
        <div class="skeleton" style="height:190px"></div>
        <div class="skeleton" style="height:190px"></div>
      </div>
      <div class="card side-card" data-embed="x" data-height="640"></div>
    </section>

    <aside>
      <div class="card subscribe-card">
        <h2>Get new posts by email</h2>
        <p>Every essay and episode lands in your inbox. Free on Substack.</p>
        <a class="btn btn-primary" href="https://collindunks.substack.com/subscribe" target="_blank" rel="noopener">Subscribe on Substack</a>
      </div>

      <div class="card side-card">
        <h2>Power Rankings</h2>
        <p class="sub">Arrows show movement since the last edition.</p>
        <div class="chip-group" id="confChips" style="margin-bottom:.6rem">
          <button type="button" class="chip active" data-conf="league">League</button>
          <button type="button" class="chip" data-conf="West">West</button>
          <button type="button" class="chip" data-conf="East">East</button>
        </div>
        <ol class="pr-list" id="rankings"><li><div class="skeleton" style="height:420px"></div></li></ol>
      </div>
    </aside>
  </div>
</main>

<script>
(function () {
  'use strict';
  const { esc } = BTR;
  const RANKINGS_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQMJMNBf3_TF9bQZrCrIo1WmJZH0LmM5oc-CRFx4orZyY4GHeVeSpEiKr7366GxcOnX0BZrfW1InNE-/pub?gid=0&single=true&output=csv';

  // ------------------------------------------------------------ posts
  let posts = [], type = 'all';
  function renderFeed() {
    const el = document.getElementById('feed');
    const shown = type === 'all' ? posts : posts.filter(p => p.type === type);
    el.innerHTML = shown.length
      ? shown.map(BTR.postCard).join('')
      : `<div class="empty-state">${posts.length ? `No ${type === 'article' ? 'articles' : 'episodes'} yet.` : 'Posts couldn\'t be loaded right now.'}
         <a href="${BTR.CONFIG.social.substack.url}" target="_blank" rel="noopener">Visit the Substack</a>.</div>`;
  }
  document.getElementById('typeChips').addEventListener('click', e => {
    const b = e.target.closest('[data-type]'); if (!b) return;
    type = b.dataset.type;
    document.querySelectorAll('#typeChips .chip').forEach(c => c.classList.toggle('active', c === b));
    renderFeed();
  });
  BTR.loadPosts().then(r => { posts = r.posts; renderFeed(); });

  // ------------------------------------------------------------ rankings
  // The sheet carries league rank, conference rank and conference; the
  // tabs switch between the full league and each conference.
  let teams = [], view = 'league';
  const MOVE = {
    up:   '<span class="pr-move up" title="Moved up">▲</span>',
    down: '<span class="pr-move down" title="Moved down">▼</span>',
    same: '<span class="pr-move same" title="No change">–</span>'
  };
  function renderRankings() {
    const el = document.getElementById('rankings');
    let list = teams;
    if (view !== 'league') list = teams.filter(t => t.conf === view).sort((a, b) => (a.confRank || 99) - (b.confRank || 99));
    el.innerHTML = list.map(t => `
      <li class="pr-item">
        <span class="pr-rank">${esc(view === 'league' ? t.rank : (t.confRank || ''))}</span>
        ${MOVE[t.move] || MOVE.same}
        <img class="pr-logo" src="nbalogos/${encodeURIComponent(t.logo)}.png" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
        <span class="pr-team">${esc(t.team)}</span>
      </li>`).join('');
  }
  document.getElementById('confChips').addEventListener('click', e => {
    const b = e.target.closest('[data-conf]'); if (!b) return;
    view = b.dataset.conf;
    document.querySelectorAll('#confChips .chip').forEach(c => c.classList.toggle('active', c === b));
    renderRankings();
  });

  fetch(RANKINGS_CSV).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(text => {
    teams = BTR.parseCSV(text).map(r => {
      const get = k => r[Object.keys(r).find(h => h.toLowerCase() === k.toLowerCase())] || '';
      const stock = get('stock').toLowerCase();
      return {
        rank: parseInt(get('rank'), 10),
        confRank: parseInt(get('conference rank'), 10) || null,
        conf: get('conference'),
        team: get('team'),
        logo: get('logo') ? get('logo').replace(/\.png$/i, '') : get('team'),
        move: stock === 'up' ? 'up' : stock === 'down' ? 'down' : 'same'
      };
    }).filter(t => t.team && !isNaN(t.rank)).sort((a, b) => a.rank - b.rank);
    // Hide the conference tabs if the sheet ever drops those columns.
    if (!teams.some(t => t.conf)) document.getElementById('confChips').remove();
    renderRankings();
  }).catch(() => {
    document.getElementById('rankings').innerHTML = '<li class="empty-state">Rankings couldn\'t be loaded right now.</li>';
  });
})();
</script>
</body>
</html>
